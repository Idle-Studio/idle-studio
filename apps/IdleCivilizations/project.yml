name: IdleCivilizations

options:
  bundleIdPrefix: com.idlestudio
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

packages:
  IdleEngine:
    path: ../../Packages/IdleEngine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 2.0.0

targets:
  IdleCivilizations:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources
      - path: ./Resources/IdleCivilizations.storekit
        buildPhase: none
        type: file
    dependencies:
      - package: IdleEngine
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idlestudio.idleciv
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # An explicit Info.plist is used (Resources/Info.plist); do not synthesize
        # one. The INFOPLIST_KEY_* build settings only apply when generating, and
        # every value they set is already present in Resources/Info.plist.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: IdleCivilizations
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JL84E9GK95
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Resources/IdleCivilizations.entitlements

schemes:
  IdleCivilizations:
    build:
      targets:
        IdleCivilizations: all
    run:
      config: Debug
      storeKitConfiguration: Resources/IdleCivilizations.storekit
    test:
      config: Debug
    archive:
      config: Release
