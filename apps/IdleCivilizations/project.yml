name: IdleCivilizations

options:
  bundleIdPrefix: com.idlestudio
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"

packages:
  IdleEngine:
    path: ../../Packages/IdleEngine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0

targets:
  IdleCivilizations:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources
      - path: ./Resources/IdleCivilizations.storekit
        buildPhase: none
        type: file
    dependencies:
      - package: IdleEngine
      - package: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idlestudio.idleciv
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: IdleCivilizations
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Idle Civilizations
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JL84E9GK95
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Resources/IdleCivilizations.entitlements

schemes:
  IdleCivilizations:
    build:
      targets:
        IdleCivilizations: all
    run:
      config: Debug
      storeKitConfiguration: Resources/IdleCivilizations.storekit
    test:
      config: Debug
    archive:
      config: Release
