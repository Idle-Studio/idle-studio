<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A6060"/>
      <stop offset="100%" stop-color="#3A3030"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E02A2A"/>
      <stop offset="100%" stop-color="#8C1010"/>
    </linearGradient>
    <linearGradient id="wokGrad" x1="15%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#484040"/>
      <stop offset="100%" stop-color="#1A1010"/>
    </linearGradient>
    <linearGradient id="wokShine" x1="10%" y1="5%" x2="60%" y2="60%">
      <stop offset="0%" stop-color="#707070" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#303030" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="30%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#4060D0"/>
      <stop offset="30%" stop-color="#F07020"/>
      <stop offset="100%" stop-color="#F0C040"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="30%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#60A0FF"/>
      <stop offset="50%" stop-color="#F8A030"/>
      <stop offset="100%" stop-color="#FFEE60"/>
    </linearGradient>
    <linearGradient id="wokGlow" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox"
      x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C040" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C07010" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="archClip">
      <path d="M18 10 L174 10 L174 175 L18 175 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#ds)">

    <!-- ══════════════════════════════════
         BACKGROUND WALL — red & gold tile pattern
         (visible through the arch opening)
    ══════════════════════════════════ -->
    <!-- Wall base -->
    <rect x="28" y="44" width="136" height="130" fill="#B01818"/>
    <!-- Tile grid lines horizontal -->
    <line x1="28" y1="60"  x2="164" y2="60"  stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="76"  x2="164" y2="76"  stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="92"  x2="164" y2="92"  stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="108" x2="164" y2="108" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="124" x2="164" y2="124" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="140" x2="164" y2="140" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="156" x2="164" y2="156" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <!-- Tile grid lines vertical -->
    <line x1="48"  y1="44" x2="48"  y2="174" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="68"  y1="44" x2="68"  y2="174" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="88"  y1="44" x2="88"  y2="174" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="108" y1="44" x2="108" y2="174" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="128" y1="44" x2="128" y2="174" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <line x1="148" y1="44" x2="148" y2="174" stroke="#F0C040" stroke-width="0.8" opacity="0.6"/>
    <!-- Gold diamond accents at tile intersections (sample) -->
    <circle cx="48"  cy="60"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="68"  cy="60"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="88"  cy="60"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="108" cy="60"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="128" cy="60"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="148" cy="60"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="48"  cy="76"  r="2.5" fill="#F0C040" opacity="0.7"/>
    <circle cx="148" cy="76"  r="2.5" fill="#F0C040" opacity="0.7"/>

    <!-- ══════════════════════════════════
         ARCHWAY FRAME — stone gray with notched border
    ══════════════════════════════════ -->
    <!-- Left pillar -->
    <rect x="10" y="10" width="32" height="172" fill="url(#archGrad)" stroke="#2A2020" stroke-width="2.5"/>
    <!-- Right pillar -->
    <rect x="150" y="10" width="32" height="172" fill="url(#archGrad)" stroke="#2A2020" stroke-width="2.5"/>
    <!-- Top lintel -->
    <rect x="10" y="10" width="172" height="38" fill="url(#archGrad)" stroke="#2A2020" stroke-width="2.5"/>
    <!-- Arch inner curve -->
    <path d="M42 48 Q42 30 96 28 Q150 30 150 48" fill="url(#archGrad)" stroke="#2A2020" stroke-width="2.5"/>

    <!-- Decorative notch border — left pillar -->
    <rect x="14" y="50"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="62"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="74"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="86"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="98"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="110" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="122" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="134" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="146" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="14" y="158" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <!-- Decorative notch border — right pillar -->
    <rect x="154" y="50"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="62"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="74"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="86"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="98"  width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="110" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="122" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="134" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="146" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="154" y="158" width="24" height="6" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <!-- Top lintel notches (horizontal row) -->
    <rect x="46"  y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="58"  y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="70"  y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="82"  y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="94"  y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="106" y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="118" y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="130" y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>
    <rect x="142" y="14" width="6" height="28" rx="2" fill="#5A5050" stroke="#3A3030" stroke-width="1"/>

    <!-- ══════════════════════════════════
         DRAGON MOTIF on arch lintel
         Simplified S-curve gold dragon silhouette
    ══════════════════════════════════ -->
    <!-- Dragon body S-curve -->
    <path d="M46 28 Q56 18 70 24 Q84 30 96 22 Q108 14 122 20 Q136 26 146 18"
          fill="none" stroke="#F0C040" stroke-width="3" stroke-linecap="round"/>
    <!-- Dragon head (left) -->
    <path d="M46 28 Q40 26 38 20 Q40 16 46 18 Q50 20 50 24 Z" fill="#F0C040" stroke="#C09020" stroke-width="1.5"/>
    <!-- Dragon eye -->
    <circle cx="41" cy="21" r="1.5" fill="#C62828"/>
    <!-- Dragon horns -->
    <line x1="44" y1="18" x2="42" y2="13" stroke="#F0C040" stroke-width="2" stroke-linecap="round"/>
    <line x1="48" y1="17" x2="48" y2="12" stroke="#F0C040" stroke-width="2" stroke-linecap="round"/>
    <!-- Dragon scales (small circles along body) -->
    <circle cx="60"  cy="22" r="2.5" fill="#F0C040" opacity="0.8"/>
    <circle cx="75"  cy="26" r="2.5" fill="#F0C040" opacity="0.8"/>
    <circle cx="96"  cy="21" r="2.5" fill="#F0C040" opacity="0.8"/>
    <circle cx="117" cy="18" r="2.5" fill="#F0C040" opacity="0.8"/>
    <circle cx="133" cy="22" r="2.5" fill="#F0C040" opacity="0.8"/>
    <!-- Dragon tail (right) -->
    <path d="M146 18 Q152 16 154 20 Q152 24 148 22" fill="#F0C040" stroke="#C09020" stroke-width="1.5"/>
    <!-- Dragon claws (small lines at 2 points) -->
    <path d="M75 26 L72 32 M75 26 L78 32 M75 26 L75 32" stroke="#F0C040" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M117 18 L114 24 M117 18 L120 24" stroke="#F0C040" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ══════════════════════════════════
         WOK RING STAND
    ══════════════════════════════════ -->
    <ellipse cx="96" cy="166" rx="32" ry="8" fill="#383030" stroke="#1A1010" stroke-width="2"/>
    <!-- Ring stand legs (3 visible) -->
    <line x1="72"  y1="163" x2="68"  y2="175" stroke="#282020" stroke-width="3" stroke-linecap="round"/>
    <line x1="96"  y1="166" x2="96"  y2="178" stroke="#282020" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="163" x2="124" y2="175" stroke="#282020" stroke-width="3" stroke-linecap="round"/>

    <!-- ══════════════════════════════════
         WOK — large rounded iron wok
    ══════════════════════════════════ -->
    <!-- Wok outer body -->
    <path d="M58 148 Q52 136 54 124 Q58 108 96 106 Q134 108 138 124 Q140 136 134 148 Q120 162 96 162 Q72 162 58 148 Z"
          fill="url(#wokGrad)" stroke="#0A0808" stroke-width="3"/>
    <!-- Wok shine highlight top-left -->
    <path d="M62 120 Q68 110 84 108 Q76 116 72 126 Z" fill="url(#wokShine)"/>
    <!-- Wok inner bowl glow (food/oil shimmer) -->
    <ellipse cx="96" cy="134" rx="32" ry="18" fill="#C07010" opacity="0.18"/>
    <ellipse cx="88" cy="130" rx="16" ry="10" fill="#F0C040" opacity="0.18"/>
    <!-- Wok handles -->
    <rect x="42" y="124" width="18" height="8" rx="4" fill="#4A4040" stroke="#282020" stroke-width="2"/>
    <rect x="44" y="125" width="14" height="6" rx="3" fill="#383030"/>
    <rect x="132" y="124" width="18" height="8" rx="4" fill="#4A4040" stroke="#282020" stroke-width="2"/>
    <rect x="134" y="125" width="14" height="6" rx="3" fill="#383030"/>

    <!-- ══════════════════════════════════
         FLAMES under wok — gas burner
    ══════════════════════════════════ -->
    <!-- Burner ring glow -->
    <ellipse cx="96" cy="167" rx="28" ry="6" fill="#4060D0" opacity="0.35"/>
    <!-- Outer flame shapes (5 flames) -->
    <path d="M72 162 Q70 150 74 140 Q78 148 76 162 Z" fill="url(#flameOuter)" opacity="0.9"/>
    <path d="M84 163 Q80 148 85 134 Q90 146 88 163 Z" fill="url(#flameOuter)" opacity="0.9"/>
    <path d="M96 164 Q93 148 96 132 Q99 148 99 164 Z" fill="url(#flameOuter)" opacity="0.9"/>
    <path d="M108 163 Q106 148 111 134 Q116 146 112 163 Z" fill="url(#flameOuter)" opacity="0.9"/>
    <path d="M120 162 Q118 150 122 140 Q126 148 124 162 Z" fill="url(#flameOuter)" opacity="0.9"/>
    <!-- Inner flame cores (brighter) -->
    <path d="M74 162 Q73 154 75 148 Q77 154 76 162 Z" fill="url(#flameInner)" opacity="0.9"/>
    <path d="M85 163 Q83 153 86 145 Q89 153 87 163 Z" fill="url(#flameInner)" opacity="0.9"/>
    <path d="M96 164 Q94 153 96 144 Q98 153 98 164 Z" fill="url(#flameInner)" opacity="0.9"/>
    <path d="M107 163 Q106 153 109 145 Q112 153 110 163 Z" fill="url(#flameInner)" opacity="0.9"/>
    <path d="M118 162 Q117 154 120 148 Q123 154 122 162 Z" fill="url(#flameInner)" opacity="0.9"/>
    <!-- Blue flame base ring -->
    <ellipse cx="96" cy="163" rx="30" ry="5" fill="#4060D0" opacity="0.45"/>

  </g>
</svg>
