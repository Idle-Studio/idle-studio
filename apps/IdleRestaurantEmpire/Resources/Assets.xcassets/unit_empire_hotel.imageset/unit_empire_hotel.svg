<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A4A"/>
      <stop offset="100%" stop-color="#2E3E5E"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8E0F0"/>
      <stop offset="100%" stop-color="#7AAAC8"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D4B8"/>
      <stop offset="100%" stop-color="#B8A880"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- Sky -->
    <rect x="14" y="14" width="164" height="164" rx="4" fill="url(#skyGrad)"/>

    <!-- Stone base/podium -->
    <rect x="36" y="148" width="120" height="22" rx="3" fill="url(#baseGrad)" stroke="#9A8860" stroke-width="2"/>
    <!-- Base highlight -->
    <rect x="36" y="148" width="120" height="5" rx="2" fill="white" opacity="0.12"/>

    <!-- Tower body -->
    <rect x="54" y="36" width="84" height="114" rx="2" fill="url(#towerGrad)" stroke="#8A9AA0" stroke-width="2.5"/>

    <!-- Glass facade overlay -->
    <rect x="58" y="40" width="76" height="106" rx="1" fill="url(#glassGrad)" opacity="0.55"/>

    <!-- Tower top-left highlight -->
    <path d="M54 36 L138 36 L138 50 Q96 43 54 52 Z" fill="white" opacity="0.14"/>

    <!-- Window grid — 4 columns × 8 rows -->
    <!-- Row 1 -->
    <rect x="62" y="44" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="44" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="44" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="44" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <!-- Gold band 1 -->
    <rect x="54" y="55" width="84" height="4" rx="1" fill="#F0C040" opacity="0.9"/>
    <!-- Row 2 -->
    <rect x="62" y="62" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="62" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="62" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="62" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <!-- Row 3 -->
    <rect x="62" y="74" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="74" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="74" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="74" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <!-- Gold band 2 -->
    <rect x="54" y="85" width="84" height="4" rx="1" fill="#F0C040" opacity="0.9"/>
    <!-- Row 4 -->
    <rect x="62" y="92" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="92" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="92" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="92" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <!-- Row 5 -->
    <rect x="62" y="104" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="104" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="104" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="104" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <!-- Gold band 3 -->
    <rect x="54" y="115" width="84" height="4" rx="1" fill="#F0C040" opacity="0.9"/>
    <!-- Row 6 -->
    <rect x="62" y="122" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="122" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="122" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="122" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <!-- Row 7 -->
    <rect x="62" y="134" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="80" y="134" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="98" y="134" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>
    <rect x="116" y="134" width="12" height="9" rx="1.5" fill="#B0D0E8" stroke="#8AB0CC" stroke-width="1" opacity="0.85"/>

    <!-- Classical crown/cornice -->
    <rect x="50" y="30" width="92" height="8" rx="2" fill="url(#crownGrad)" stroke="#8B6914" stroke-width="2"/>
    <rect x="52" y="28" width="88" height="5" rx="2" fill="#F0C040" stroke="#B8860B" stroke-width="1.5"/>

    <!-- Fork silhouette (left, overlaid on tower) -->
    <g opacity="0.72">
      <!-- Fork handle -->
      <rect x="71" y="54" width="7" height="62" rx="3.5" fill="#F0C040" stroke="#B8860B" stroke-width="1"/>
      <!-- Fork head -->
      <rect x="71" y="36" width="7" height="22" rx="3.5" fill="#F0C040" stroke="#B8860B" stroke-width="1"/>
      <!-- Fork tines (3 tines) -->
      <rect x="70" y="36" width="2.5" height="14" rx="1.25" fill="#F0C040"/>
      <rect x="74" y="36" width="2.5" height="14" rx="1.25" fill="#F0C040"/>
      <rect x="78" y="36" width="2.5" height="14" rx="1.25" fill="#F0C040"/>
      <!-- Tine gaps -->
      <rect x="72.5" y="36" width="1.5" height="10" fill="#8B6914" opacity="0.6"/>
      <rect x="76.5" y="36" width="1.5" height="10" fill="#8B6914" opacity="0.6"/>
    </g>

    <!-- Knife silhouette (right, overlaid on tower) -->
    <g opacity="0.72">
      <!-- Knife handle -->
      <rect x="114" y="86" width="7" height="32" rx="3.5" fill="#F0C040" stroke="#B8860B" stroke-width="1"/>
      <!-- Knife bolster -->
      <rect x="113" y="82" width="9" height="6" rx="2" fill="#D4A020"/>
      <!-- Knife blade -->
      <path d="M114 36 L121 36 L121 82 Q121 82 117.5 84 Q114 82 114 82 Z" fill="#F0C040" stroke="#B8860B" stroke-width="1"/>
      <!-- Blade edge highlight -->
      <path d="M121 36 L121 78" stroke="#FFF0A0" stroke-width="1" opacity="0.7"/>
    </g>

    <!-- Clouds -->
    <ellipse cx="46" cy="26" rx="14" ry="7" fill="white" opacity="0.80"/>
    <ellipse cx="36" cy="26" rx="9" ry="6" fill="white" opacity="0.75"/>
    <ellipse cx="152" cy="22" rx="12" ry="6" fill="white" opacity="0.78"/>
    <ellipse cx="163" cy="22" rx="8" ry="5" fill="white" opacity="0.72"/>

  </g>
</svg>
