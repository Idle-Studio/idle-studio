<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <!-- Stone wall gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3830"/>
      <stop offset="100%" stop-color="#2A2820"/>
    </linearGradient>
    <!-- Wood shelf gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A87040"/>
      <stop offset="100%" stop-color="#6B3A1A"/>
    </linearGradient>
    <!-- Cheese wheel gradient (aged) -->
    <linearGradient id="cheeseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCC070"/>
      <stop offset="100%" stop-color="#9A6020"/>
    </linearGradient>
    <!-- Cheese interior (cut face) -->
    <linearGradient id="cheeseInterior" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C89020"/>
    </linearGradient>
    <!-- Floor gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303840"/>
      <stop offset="100%" stop-color="#161E22"/>
    </linearGradient>
    <!-- Overhead warm light -->
    <radialGradient id="overheadLight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#F0D080" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F0D080" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── STONE WALL BACKGROUND ── -->
    <rect x="14" y="14" width="164" height="148" rx="6" fill="url(#wallGrad)"/>

    <!-- Stone block irregular pattern -->
    <!-- Row 1 -->
    <rect x="16" y="16" width="52" height="26" rx="2" fill="none" stroke="#484840" stroke-width="1" opacity="0.6"/>
    <rect x="70" y="16" width="60" height="26" rx="2" fill="none" stroke="#484840" stroke-width="1" opacity="0.6"/>
    <rect x="132" y="16" width="44" height="26" rx="2" fill="none" stroke="#484840" stroke-width="1" opacity="0.6"/>
    <!-- Row 2 -->
    <rect x="14" y="44" width="40" height="24" rx="2" fill="none" stroke="#484840" stroke-width="1" opacity="0.5"/>
    <rect x="56" y="44" width="56" height="24" rx="2" fill="none" stroke="#484840" stroke-width="1" opacity="0.5"/>
    <rect x="114" y="44" width="64" height="24" rx="2" fill="none" stroke="#484840" stroke-width="1" opacity="0.5"/>
    <!-- Row 3 (behind upper shelf) -->
    <rect x="16" y="70" width="70" height="20" rx="2" fill="none" stroke="#444840" stroke-width="1" opacity="0.4"/>
    <rect x="88" y="70" width="88" height="20" rx="2" fill="none" stroke="#444840" stroke-width="1" opacity="0.4"/>

    <!-- Overhead light glow -->
    <rect x="14" y="14" width="164" height="148" rx="6" fill="url(#overheadLight)"/>

    <!-- ── FLOOR ── -->
    <rect x="14" y="148" width="164" height="14" rx="4" fill="url(#floorGrad)"/>
    <rect x="14" y="148" width="164" height="14" rx="4" fill="none" stroke="#161E22" stroke-width="1.5"/>

    <!-- ── UPPER WOODEN SHELF ── -->
    <!-- Bracket supports -->
    <path d="M36 92 L36 104 Q36 108 42 108 L42 104 L54 104" fill="none" stroke="#5A3010" stroke-width="3" stroke-linecap="round"/>
    <path d="M156 92 L156 104 Q156 108 150 108 L150 104 L138 104" fill="none" stroke="#5A3010" stroke-width="3" stroke-linecap="round"/>
    <!-- Shelf plank -->
    <rect x="28" y="88" width="136" height="14" rx="3" fill="url(#woodGrad)" stroke="#4A2810" stroke-width="2.5"/>
    <!-- Wood grain lines -->
    <line x1="30" y1="93" x2="162" y2="93" stroke="#9A6030" stroke-width="0.8" opacity="0.4"/>
    <line x1="30" y1="97" x2="162" y2="97" stroke="#7A4820" stroke-width="0.6" opacity="0.3"/>

    <!-- ── LOWER WOODEN SHELF ── -->
    <!-- Bracket supports -->
    <path d="M36 136 L36 148 Q36 152 42 152 L42 148 L54 148" fill="none" stroke="#5A3010" stroke-width="3" stroke-linecap="round"/>
    <path d="M156 136 L156 148 Q156 152 150 152 L150 148 L138 148" fill="none" stroke="#5A3010" stroke-width="3" stroke-linecap="round"/>
    <!-- Shelf plank -->
    <rect x="28" y="132" width="136" height="14" rx="3" fill="url(#woodGrad)" stroke="#4A2810" stroke-width="2.5"/>
    <!-- Wood grain lines -->
    <line x1="30" y1="137" x2="162" y2="137" stroke="#9A6030" stroke-width="0.8" opacity="0.4"/>
    <line x1="30" y1="141" x2="162" y2="141" stroke="#7A4820" stroke-width="0.6" opacity="0.3"/>

    <!-- ═══ CHEESE WHEELS ON UPPER SHELF ═══ -->

    <!-- Cheese wheel 1 (left, full wheel seen from slight angle) -->
    <g transform="translate(58, 74)">
      <!-- Cylinder side band (rind) -->
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="#7A5020" stroke="#4A3010" stroke-width="1.5"/>
      <!-- Rind texture marks -->
      <path d="M-18 -2 Q0 -5 18 -2" fill="none" stroke="#5A3810" stroke-width="0.8" opacity="0.7"/>
      <!-- Top face of wheel -->
      <ellipse cx="0" cy="-6" rx="20" ry="8" fill="url(#cheeseGrad)" stroke="#7A5020" stroke-width="2"/>
      <!-- Top face highlight -->
      <ellipse cx="-5" cy="-9" rx="10" ry="4" fill="#F0D880" opacity="0.4"/>
      <!-- Label tag -->
      <rect x="-8" y="2" width="16" height="6" rx="1" fill="#F5EDD8" stroke="#C0A060" stroke-width="1"/>
      <line x1="-5" y1="5" x2="5" y2="5" stroke="#A08040" stroke-width="0.7"/>
    </g>

    <!-- Cheese wheel 2 (center-left, slightly different angle) -->
    <g transform="translate(96, 72)">
      <!-- Rind side -->
      <ellipse cx="0" cy="0" rx="22" ry="9" fill="#8B6030" stroke="#5A3810" stroke-width="1.5"/>
      <!-- Top face -->
      <ellipse cx="0" cy="-7" rx="22" ry="9" fill="url(#cheeseGrad)" stroke="#7A5020" stroke-width="2"/>
      <ellipse cx="-5" cy="-10" rx="11" ry="4" fill="#F0D880" opacity="0.35"/>
      <!-- Label -->
      <rect x="-9" y="2" width="18" height="6" rx="1" fill="#F5EDD8" stroke="#C0A060" stroke-width="1"/>
      <line x1="-6" y1="5" x2="6" y2="5" stroke="#A08040" stroke-width="0.7"/>
    </g>

    <!-- Cheese wheel 3 — CUT IN HALF, right side of upper shelf -->
    <g transform="translate(142, 74)">
      <!-- Half wheel: the back (cut face showing interior) -->
      <!-- Cut face ellipse -->
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="url(#cheeseInterior)" stroke="#A07020" stroke-width="2"/>
      <!-- Cut face interior crumbly texture (small dots) -->
      <circle cx="-8" cy="-1" r="1.5" fill="#D4A030" opacity="0.7"/>
      <circle cx="-2" cy="-3" r="1.2" fill="#C89020" opacity="0.6"/>
      <circle cx="5" cy="1" r="1.5" fill="#D4A030" opacity="0.7"/>
      <circle cx="11" cy="-2" r="1" fill="#C89020" opacity="0.6"/>
      <circle cx="-12" cy="2" r="1" fill="#B88010" opacity="0.5"/>
      <circle cx="8" cy="-4" r="1.2" fill="#E0B040" opacity="0.6"/>
      <!-- Rind ring on cut face -->
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="#8B6030" stroke-width="3"/>
      <!-- Remaining side (half cylinder) -->
      <path d="M-20 0 Q-20 7 0 10 Q20 7 20 0" fill="#7A5020" stroke="#4A3010" stroke-width="1.5"/>
      <!-- Half wheel top arc -->
      <path d="M-20 -7 Q-20 -14 0 -17 Q20 -14 20 -7" fill="url(#cheeseGrad)" stroke="#7A5020" stroke-width="2"/>
      <path d="M-10 -14 Q0 -17 12 -14" fill="none" stroke="#F0D880" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- ═══ CHEESE ON LOWER SHELF ═══ -->

    <!-- Cheese wheel 4 (center, lower shelf) -->
    <g transform="translate(96, 118)">
      <ellipse cx="0" cy="0" rx="24" ry="10" fill="#8B6030" stroke="#5A3810" stroke-width="1.5"/>
      <ellipse cx="0" cy="-8" rx="24" ry="10" fill="url(#cheeseGrad)" stroke="#7A5020" stroke-width="2"/>
      <ellipse cx="-6" cy="-11" rx="12" ry="5" fill="#F0D880" opacity="0.35"/>
      <!-- Label tag (leaning against shelf front) -->
      <rect x="-10" y="3" width="20" height="7" rx="1.5" fill="#F5EDD8" stroke="#C0A060" stroke-width="1.2"/>
      <line x1="-7" y1="6.5" x2="7" y2="6.5" stroke="#A08040" stroke-width="0.8"/>
      <line x1="-7" y1="8.5" x2="4" y2="8.5" stroke="#A08040" stroke-width="0.5" opacity="0.6"/>
    </g>

    <!-- Wall outline over everything -->
    <rect x="14" y="14" width="164" height="148" rx="6" fill="none" stroke="#1A1810" stroke-width="3"/>

  </g>
</svg>
