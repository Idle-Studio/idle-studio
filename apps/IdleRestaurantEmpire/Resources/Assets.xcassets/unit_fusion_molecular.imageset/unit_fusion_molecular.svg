<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <!-- Tray surface -->
    <linearGradient id="trayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3050"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <!-- Syringe barrel glass -->
    <linearGradient id="syringeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B3E5FC" stop-opacity="0.80"/>
      <stop offset="40%" stop-color="#E8F8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B3E5FC" stop-opacity="0.50"/>
    </linearGradient>
    <!-- Orange liquid in syringe -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0B040"/>
      <stop offset="100%" stop-color="#D07820"/>
    </linearGradient>
    <!-- Petri dish -->
    <linearGradient id="petriGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8F0FF" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#80C8E8" stop-opacity="0.40"/>
    </linearGradient>
    <!-- Steel tweezers -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D0D8E0"/>
      <stop offset="100%" stop-color="#8090A0"/>
    </linearGradient>
    <!-- Neon glow under syringe -->
    <radialGradient id="neonGlow" cx="30%" cy="75%" r="28%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E040FB" stop-opacity="0"/>
    </radialGradient>
    <!-- Purple packet -->
    <linearGradient id="packetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E24AA"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <!-- Vapor/smoke color -->
    <linearGradient id="vaporGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D0D8F0" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#B0B8E0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── TRAY SURFACE ── -->
    <rect x="24" y="100" width="144" height="56" rx="6" fill="url(#trayGrad)" stroke="#0A0820" stroke-width="2.5"/>
    <!-- Tray top highlight edge -->
    <rect x="24" y="100" width="144" height="5" rx="3" fill="white" opacity="0.07"/>
    <!-- Tray corner screws -->
    <circle cx="32" cy="108" r="3" fill="#2A2040" stroke="#3A3060" stroke-width="1"/>
    <circle cx="160" cy="108" r="3" fill="#2A2040" stroke="#3A3060" stroke-width="1"/>
    <circle cx="32" cy="148" r="3" fill="#2A2040" stroke="#3A3060" stroke-width="1"/>
    <circle cx="160" cy="148" r="3" fill="#2A2040" stroke="#3A3060" stroke-width="1"/>

    <!-- Neon glow under syringe -->
    <rect x="24" y="100" width="144" height="56" rx="6" fill="url(#neonGlow)"/>

    <!-- ══════════
         SYRINGE (left side, angled slightly)
    ══════════ -->
    <!-- Syringe barrel -->
    <rect x="38" y="42" width="20" height="68" rx="4" fill="url(#syringeGrad)" stroke="#80C8E8" stroke-width="2"/>
    <!-- Orange liquid inside barrel (lower portion) -->
    <rect x="40" y="78" width="16" height="30" rx="3" fill="url(#liquidGrad)" opacity="0.85"/>
    <!-- Measurement lines on barrel -->
    <line x1="53" y1="52" x2="57" y2="52" stroke="#4080A0" stroke-width="1" opacity="0.7"/>
    <line x1="53" y1="60" x2="57" y2="60" stroke="#4080A0" stroke-width="1" opacity="0.7"/>
    <line x1="53" y1="68" x2="57" y2="68" stroke="#4080A0" stroke-width="1" opacity="0.7"/>
    <line x1="53" y1="76" x2="57" y2="76" stroke="#4080A0" stroke-width="1" opacity="0.7"/>
    <!-- Barrel glass highlight -->
    <rect x="40" y="44" width="5" height="56" rx="2" fill="white" opacity="0.22"/>
    <!-- Plunger handle (top) -->
    <rect x="34" y="36" width="28" height="8" rx="3" fill="#8090A0" stroke="#607080" stroke-width="1.5"/>
    <rect x="42" y="36" width="12" height="8" rx="2" fill="#9AAABB"/>
    <!-- Plunger rod -->
    <rect x="46" y="44" width="4" height="16" rx="1" fill="#9AAABB" stroke="#708090" stroke-width="1"/>
    <!-- Needle tip -->
    <rect x="46" y="110" width="4" height="12" rx="1" fill="#B0BEC5" stroke="#8090A0" stroke-width="1"/>
    <path d="M47 122 L48 132 L49 122 Z" fill="#9AAABB" stroke="#708090" stroke-width="1"/>
    <!-- Barrel outline -->
    <rect x="38" y="42" width="20" height="68" rx="4" fill="none" stroke="#80C8E8" stroke-width="2"/>
    <!-- Neon accent line at needle -->
    <line x1="38" y1="110" x2="58" y2="110" stroke="#E040FB" stroke-width="1.5" opacity="0.55"/>

    <!-- ══════════
         PETRI DISH (center)
    ══════════ -->
    <!-- Dish base -->
    <ellipse cx="110" cy="128" rx="36" ry="12" fill="url(#petriGrad)" stroke="#80C8E8" stroke-width="2"/>
    <!-- Dish rim -->
    <ellipse cx="110" cy="124" rx="36" ry="10" fill="none" stroke="#80C8E8" stroke-width="1.5" opacity="0.50"/>
    <!-- Dish glass highlight -->
    <path d="M78 122 Q88 118 98 122" fill="none" stroke="white" stroke-width="1.5" opacity="0.30"/>
    <!-- Caviar pearls — 6 arranged in pattern -->
    <circle cx="104" cy="126" r="4.5" fill="url(#liquidGrad)" stroke="#A05010" stroke-width="1"/>
    <circle cx="114" cy="124" r="4.5" fill="url(#liquidGrad)" stroke="#A05010" stroke-width="1"/>
    <circle cx="124" cy="127" r="4.5" fill="url(#liquidGrad)" stroke="#A05010" stroke-width="1"/>
    <circle cx="109" cy="134" r="4.5" fill="url(#liquidGrad)" stroke="#A05010" stroke-width="1"/>
    <circle cx="119" cy="132" r="4.5" fill="url(#liquidGrad)" stroke="#A05010" stroke-width="1"/>
    <!-- Pearl highlights -->
    <circle cx="103" cy="124" r="1.5" fill="white" opacity="0.55"/>
    <circle cx="113" cy="122" r="1.5" fill="white" opacity="0.55"/>
    <circle cx="108" cy="132" r="1.5" fill="white" opacity="0.55"/>

    <!-- ══════════
         LIQUID NITROGEN WISPS
    ══════════ -->
    <!-- Wisp layer 1 (bottom, wide) -->
    <path d="M24 148 Q40 138 60 144 Q80 150 100 143 Q120 136 144 143 Q158 147 168 140 L168 156 Q140 160 110 154 Q80 148 50 156 Q36 159 24 155 Z"
          fill="url(#vaporGrad)" opacity="0.55"/>
    <!-- Wisp layer 2 (middle) -->
    <path d="M30 140 Q50 130 72 136 Q92 142 114 134 Q136 126 158 134 L160 142 Q136 134 114 142 Q92 150 70 144 Q48 138 28 148 Z"
          fill="url(#vaporGrad)" opacity="0.42"/>
    <!-- Wisp layer 3 (rolling wisps) -->
    <path d="M50 132 Q62 124 76 130 Q88 136 104 128 Q118 120 136 127"
          fill="none" stroke="#D0D8F0" stroke-width="3" stroke-linecap="round" opacity="0.38"/>
    <path d="M40 136 Q55 126 70 132"
          fill="none" stroke="#D0D8F0" stroke-width="2" stroke-linecap="round" opacity="0.30"/>
    <path d="M120 130 Q135 122 152 128"
          fill="none" stroke="#D0D8F0" stroke-width="2" stroke-linecap="round" opacity="0.30"/>

    <!-- ══════════
         TWEEZERS (resting on tray)
    ══════════ -->
    <!-- Tweezer left arm -->
    <path d="M134 108 Q140 118 138 132" fill="none" stroke="url(#steelGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tweezer right arm -->
    <path d="M150 108 Q144 118 143 132" fill="none" stroke="url(#steelGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tweezer join at top -->
    <path d="M134 108 Q142 104 150 108" fill="none" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round"/>
    <!-- Tip dots -->
    <circle cx="138" cy="132" r="1.5" fill="#B0BEC5"/>
    <circle cx="143" cy="132" r="1.5" fill="#B0BEC5"/>

    <!-- ══════════
         AGAR POWDER PACKET (corner)
    ══════════ -->
    <rect x="68" y="102" width="28" height="18" rx="3" fill="url(#packetGrad)" stroke="#6A1B9A" stroke-width="1.5"/>
    <!-- Packet label -->
    <rect x="71" y="106" width="22" height="7" rx="1" fill="#CE93D8" opacity="0.55"/>
    <line x1="73" y1="108" x2="91" y2="108" stroke="#4A148C" stroke-width="1" opacity="0.6"/>
    <line x1="73" y1="111" x2="87" y2="111" stroke="#4A148C" stroke-width="1" opacity="0.6"/>
    <!-- Packet seal crease -->
    <line x1="68" y1="111" x2="96" y2="111" stroke="#4A148C" stroke-width="1" opacity="0.35"/>

  </g>
</svg>
