<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="stripGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="30%" stop-color="#D8D8D8"/>
      <stop offset="70%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <linearGradient id="bladeSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A5040"/>
      <stop offset="100%" stop-color="#3A2018"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── MAGNETIC WALL STRIP ── -->
    <rect x="16" y="86" width="160" height="20" rx="4" fill="url(#stripGrad)" stroke="#101010" stroke-width="2"/>
    <!-- Strip highlight top edge -->
    <rect x="18" y="87" width="156" height="4" rx="2" fill="#505050" opacity="0.6"/>
    <!-- Mounting screws -->
    <circle cx="36" cy="96" r="5" fill="#2A2A2A" stroke="#555555" stroke-width="1.5"/>
    <line x1="33" y1="96" x2="39" y2="96" stroke="#777777" stroke-width="1.5"/>
    <line x1="36" y1="93" x2="36" y2="99" stroke="#777777" stroke-width="1.5"/>
    <circle cx="156" cy="96" r="5" fill="#2A2A2A" stroke="#555555" stroke-width="1.5"/>
    <line x1="153" y1="96" x2="159" y2="96" stroke="#777777" stroke-width="1.5"/>
    <line x1="156" y1="93" x2="156" y2="99" stroke="#777777" stroke-width="1.5"/>

    <!-- ── BLUE GLOW (ocean accent beneath blade) ── -->
    <ellipse cx="96" cy="108" rx="78" ry="10" fill="url(#glowGrad)"/>

    <!-- ── YANAGIBA KNIFE ── -->
    <!-- Knife is positioned hanging vertically-center from the strip -->
    <!-- Full knife: ~150px tall, centered at x=96 -->

    <!-- Collar (ferrule) where handle meets blade -->
    <rect x="83" y="85" width="26" height="10" rx="2" fill="#2A2020" stroke="#1A1010" stroke-width="1.5"/>
    <!-- Collar highlight -->
    <rect x="84" y="86" width="8" height="4" rx="1" fill="#555050" opacity="0.6"/>

    <!-- Wa-style handle (octagonal wooden, above collar) -->
    <!-- Octagonal shape approximated with polygon -->
    <polygon points="86,26 90,22 102,22 106,26 108,52 108,85 84,85 84,52"
             fill="url(#handleGrad)" stroke="#2A1408" stroke-width="2"/>
    <!-- Handle highlight -->
    <polygon points="86,26 90,22 96,22 96,85 84,85 84,52"
             fill="#9A6850" opacity="0.35"/>
    <!-- Handle wood grain -->
    <line x1="87" y1="35" x2="105" y2="35" stroke="#4A2C18" stroke-width="1" opacity="0.5"/>
    <line x1="87" y1="45" x2="105" y2="45" stroke="#4A2C18" stroke-width="1" opacity="0.5"/>
    <line x1="87" y1="55" x2="105" y2="55" stroke="#4A2C18" stroke-width="1" opacity="0.5"/>
    <line x1="87" y1="65" x2="105" y2="65" stroke="#4A2C18" stroke-width="1" opacity="0.5"/>
    <line x1="87" y1="75" x2="105" y2="75" stroke="#4A2C18" stroke-width="1" opacity="0.4"/>
    <!-- Handle end cap (butt of handle) -->
    <rect x="84" y="22" width="24" height="6" rx="2" fill="#1A0C08" stroke="#0A0804" stroke-width="1"/>

    <!-- ── BLADE (single-bevel yanagiba) ── -->
    <!-- Long thin blade tapering toward tip -->
    <!-- Blade shape: wide at bolster, tapers and curves to tip -->
    <path d="M84 95 L84 168 Q85 174 88 176 L108 95 Z"
          fill="url(#bladeGrad)" stroke="#787878" stroke-width="2"/>
    <!-- Single bevel flat side (right side — slight lighter line) -->
    <path d="M107 95 L88 176" fill="none" stroke="#E0E0E0" stroke-width="1" opacity="0.8"/>
    <!-- Hollow grind subtle line -->
    <path d="M90 100 Q92 130 90 168" fill="none" stroke="#D0D0D0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Bevel edge line (cutting edge, bottom) -->
    <path d="M84 95 L84 168 Q85 174 88 176" fill="none" stroke="#F4F4F4" stroke-width="1.5" opacity="0.9"/>
    <!-- Blade sheen/highlight -->
    <path d="M86 95 L86 165 Q87 172 89 175" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Shinogi line (ridge line on single bevel) -->
    <path d="M98 96 L96 174" fill="none" stroke="#C8C8C8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Blue accent shadow/glow reflected on blade surface -->
    <path d="M90 105 Q95 108 104 106" fill="none" stroke="#42A5F5" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
    <path d="M88 115 Q94 118 103 116" fill="none" stroke="#1565C0" stroke-width="1" stroke-linecap="round" opacity="0.2"/>

  </g>
</svg>
