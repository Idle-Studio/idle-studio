<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B6451"/>
      <stop offset="40%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4A3028"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FEFCF5"/>
      <stop offset="100%" stop-color="#EDE5CC"/>
    </linearGradient>
    <linearGradient id="salmonGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF8C60"/>
      <stop offset="100%" stop-color="#E85A20"/>
    </linearGradient>
    <linearGradient id="tunaGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#D84040"/>
      <stop offset="100%" stop-color="#9A1A1A"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── WOODEN BOARD ── -->
    <rect x="24" y="100" width="144" height="68" rx="9" fill="url(#boardGrad)" stroke="#3A2018" stroke-width="3"/>

    <!-- Board highlight (left edge reflection) -->
    <rect x="27" y="104" width="6" height="56" rx="3" fill="#A07868" opacity="0.45"/>

    <!-- Wood grain lines -->
    <line x1="30" y1="110" x2="162" y2="113" stroke="#7A5545" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="120" x2="162" y2="123" stroke="#5C3E30" stroke-width="0.8" opacity="0.5"/>
    <line x1="30" y1="132" x2="162" y2="135" stroke="#7A5545" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="143" x2="162" y2="146" stroke="#5C3E30" stroke-width="0.8" opacity="0.5"/>
    <line x1="30" y1="154" x2="162" y2="157" stroke="#7A5545" stroke-width="0.8" opacity="0.4"/>

    <!-- ── LEFT NIGIRI (Salmon) ── -->
    <!-- Rice pillow -->
    <ellipse cx="68" cy="106" rx="26" ry="14" fill="url(#riceGrad)" stroke="#C8BEA0" stroke-width="2"/>
    <!-- Rice grain texture lines -->
    <line x1="52" y1="104" x2="66" y2="108" stroke="#D8D0B8" stroke-width="1" opacity="0.7"/>
    <line x1="56" y1="100" x2="72" y2="106" stroke="#D8D0B8" stroke-width="1" opacity="0.7"/>
    <line x1="62" y1="98" x2="78" y2="104" stroke="#D8D0B8" stroke-width="1" opacity="0.6"/>
    <line x1="70" y1="98" x2="82" y2="103" stroke="#D8D0B8" stroke-width="0.8" opacity="0.5"/>

    <!-- Wasabi dab (left nigiri) -->
    <ellipse cx="68" cy="93" rx="6" ry="3.5" fill="#5A7828" stroke="#3A5010" stroke-width="1"/>

    <!-- Salmon slice draped over rice -->
    <path d="M44 96 Q46 86 68 84 Q90 86 92 96 Q88 106 68 107 Q48 106 44 96 Z"
          fill="url(#salmonGrad)" stroke="#C04010" stroke-width="2"/>
    <!-- Salmon fat marbling lines -->
    <path d="M52 90 Q62 88 74 91" fill="none" stroke="#FFCAA0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M55 95 Q66 93 78 96" fill="none" stroke="#FFCAA0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M58 100 Q68 98 80 101" fill="none" stroke="#FFB880" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Salmon highlight -->
    <path d="M50 89 Q62 85 76 88" fill="none" stroke="#FFAA70" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- ── RIGHT NIGIRI (Tuna) ── -->
    <!-- Rice pillow -->
    <ellipse cx="128" cy="106" rx="26" ry="14" fill="url(#riceGrad)" stroke="#C8BEA0" stroke-width="2"/>
    <!-- Rice grain texture lines -->
    <line x1="112" y1="104" x2="126" y2="108" stroke="#D8D0B8" stroke-width="1" opacity="0.7"/>
    <line x1="116" y1="100" x2="132" y2="106" stroke="#D8D0B8" stroke-width="1" opacity="0.7"/>
    <line x1="122" y1="98" x2="138" y2="104" stroke="#D8D0B8" stroke-width="1" opacity="0.6"/>
    <line x1="130" y1="98" x2="142" y2="103" stroke="#D8D0B8" stroke-width="0.8" opacity="0.5"/>

    <!-- Wasabi dab (right nigiri) -->
    <ellipse cx="128" cy="93" rx="6" ry="3.5" fill="#5A7828" stroke="#3A5010" stroke-width="1"/>

    <!-- Tuna slice draped over rice -->
    <path d="M104 96 Q106 86 128 84 Q150 86 152 96 Q148 106 128 107 Q108 106 104 96 Z"
          fill="url(#tunaGrad)" stroke="#7A1010" stroke-width="2"/>
    <!-- Tuna marbling lines -->
    <path d="M112 90 Q122 88 134 91" fill="none" stroke="#E07070" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M114 95 Q125 93 137 96" fill="none" stroke="#E07070" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Tuna highlight -->
    <path d="M110 89 Q122 85 136 88" fill="none" stroke="#CC4040" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Nori band on tuna nigiri -->
    <path d="M113 104 Q113 86 118 84 L114 84 Q109 86 109 104 Z"
          fill="#1A2A1A" opacity="0.80"/>
    <path d="M143 104 Q143 86 138 84 L142 84 Q147 86 147 104 Z"
          fill="#1A2A1A" opacity="0.80"/>

    <!-- ── GARNISH: pickled ginger between nigiri ── -->
    <path d="M94 118 Q96 112 100 116 Q104 120 102 124 Q100 128 96 126 Q92 124 94 118 Z"
          fill="#F0C8B0" stroke="#C89080" stroke-width="1" opacity="0.85"/>
    <path d="M94 119 Q98 114 102 118" fill="none" stroke="#D8A090" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- Soy sauce small dish (bottom right) -->
    <ellipse cx="148" cy="148" rx="18" ry="10" fill="#1A0A00" stroke="#3A1500" stroke-width="1.5"/>
    <ellipse cx="148" cy="148" rx="14" ry="7" fill="#3A1000" opacity="0.8"/>
    <!-- Soy surface highlight -->
    <path d="M138 146 Q143 143 150 145" fill="none" stroke="#6A3A10" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  </g>
</svg>
