<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="trayGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#D8AA80"/>
      <stop offset="100%" stop-color="#9A6840"/>
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FEFCF5"/>
      <stop offset="60%" stop-color="#F5EDD8"/>
      <stop offset="100%" stop-color="#E0D4B8"/>
    </linearGradient>
    <linearGradient id="sakeGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C848"/>
      <stop offset="100%" stop-color="#C89820"/>
    </linearGradient>
    <linearGradient id="sakeAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0B030"/>
      <stop offset="100%" stop-color="#B08010"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── SERVING TRAY ── -->
    <rect x="28" y="148" width="136" height="22" rx="5" fill="url(#trayGrad)" stroke="#7A5030" stroke-width="2.5"/>
    <!-- Tray highlight -->
    <rect x="32" y="150" width="40" height="5" rx="2.5" fill="#E8C090" opacity="0.45"/>
    <!-- Tray wood grain -->
    <line x1="32"  y1="155" x2="158" y2="158" stroke="#9A6A3A" stroke-width="1" opacity="0.45"/>
    <line x1="32"  y1="162" x2="158" y2="164" stroke="#7A5020" stroke-width="0.8" opacity="0.4"/>
    <!-- Tray rim edge -->
    <rect x="28" y="148" width="136" height="4" rx="2" fill="#B88040" opacity="0.5"/>

    <!-- ── TOKKURI (sake carafe) — centered-left ── -->
    <!-- Carafe body: bulbous lower, narrow neck -->
    <!-- Lower bulb -->
    <path d="M62 148 Q38 148 36 118 Q34 88 52 76 Q66 68 80 74 Q94 80 94 110 Q94 148 62 148 Z"
          fill="url(#ceramicGrad)" stroke="#0D47A1" stroke-width="2.5"/>
    <!-- Carafe highlight (top-left) -->
    <path d="M46 86 Q42 100 44 118 Q46 130 52 140"
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

    <!-- Blue painted band on upper body -->
    <path d="M46 90 Q50 82 66 80 Q82 82 88 90 Q84 100 66 102 Q48 100 46 90 Z"
          fill="url(#bandGrad)" opacity="0.9"/>
    <!-- Band stroke -->
    <path d="M46 90 Q50 82 66 80 Q82 82 88 90 Q84 100 66 102 Q48 100 46 90 Z"
          fill="none" stroke="#082060" stroke-width="1.5"/>

    <!-- Indigo flower/pine pattern on band -->
    <!-- Simplified petals around center point -->
    <circle cx="60" cy="91" r="3" fill="#B3E5FC" opacity="0.7"/>
    <path d="M60 85 Q62 88 60 91 Q58 88 60 85 Z" fill="#B3E5FC" opacity="0.7"/>
    <path d="M66 91 Q63 92 60 91 Q63 90 66 91 Z" fill="#B3E5FC" opacity="0.7"/>
    <path d="M60 97 Q62 94 60 91 Q58 94 60 97 Z" fill="#B3E5FC" opacity="0.7"/>
    <path d="M54 91 Q57 90 60 91 Q57 92 54 91 Z" fill="#B3E5FC" opacity="0.7"/>
    <!-- Second small motif -->
    <circle cx="76" cy="91" r="2.5" fill="#B3E5FC" opacity="0.6"/>
    <path d="M76 86 Q77.5 88.5 76 91 Q74.5 88.5 76 86 Z" fill="#B3E5FC" opacity="0.6"/>
    <path d="M81 91 Q78.5 92 76 91 Q78.5 90 81 91 Z" fill="#B3E5FC" opacity="0.6"/>
    <path d="M76 96 Q77.5 93.5 76 91 Q74.5 93.5 76 96 Z" fill="#B3E5FC" opacity="0.6"/>
    <path d="M71 91 Q73.5 90 76 91 Q73.5 92 71 91 Z" fill="#B3E5FC" opacity="0.6"/>

    <!-- Neck of carafe -->
    <rect x="58" y="52" width="16" height="28" rx="6" fill="url(#ceramicGrad)" stroke="#0D47A1" stroke-width="2.5"/>
    <!-- Neck highlight -->
    <rect x="60" y="54" width="5" height="20" rx="2.5" fill="#FFFFFF" opacity="0.45"/>

    <!-- Sake visible through neck (warm gold) -->
    <rect x="60" y="62" width="12" height="16" rx="4" fill="url(#sakeGold)" opacity="0.8"/>

    <!-- Carafe rim / mouth -->
    <ellipse cx="66" cy="52" rx="10" ry="5" fill="#F0EAD8" stroke="#0D47A1" stroke-width="2"/>
    <ellipse cx="66" cy="52" rx="7" ry="3" fill="url(#sakeGold)" opacity="0.7"/>

    <!-- Carafe outline connecting neck to body -->
    <path d="M58 76 Q52 76 46 90" fill="none" stroke="#0D47A1" stroke-width="2.5"/>
    <path d="M74 76 Q82 78 88 90" fill="none" stroke="#0D47A1" stroke-width="2.5"/>

    <!-- ── OCHOKO CUP (small, right of carafe) ── -->
    <!-- Cup body: small cylinder, forward of carafe -->
    <path d="M108 148 Q100 148 98 130 Q96 116 100 112 L124 112 Q128 116 126 130 Q124 148 116 148 Z"
          fill="url(#ceramicGrad)" stroke="#0D47A1" stroke-width="2.5"/>
    <!-- Cup highlight -->
    <path d="M102 116 Q100 124 101 134"
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

    <!-- Blue band on cup -->
    <path d="M100 120 Q102 114 112 113 Q122 114 124 120 Q122 126 112 127 Q102 126 100 120 Z"
          fill="url(#bandGrad)" opacity="0.9"/>
    <path d="M100 120 Q102 114 112 113 Q122 114 124 120 Q122 126 112 127 Q102 126 100 120 Z"
          fill="none" stroke="#082060" stroke-width="1"/>
    <!-- Small pine motif on cup band -->
    <circle cx="112" cy="120" r="2.5" fill="#B3E5FC" opacity="0.7"/>
    <path d="M112 116 Q113.5 118 112 120 Q110.5 118 112 116 Z" fill="#B3E5FC" opacity="0.7"/>
    <path d="M116 120 Q114 121 112 120 Q114 119 116 120 Z" fill="#B3E5FC" opacity="0.7"/>
    <path d="M112 124 Q113.5 122 112 120 Q110.5 122 112 124 Z" fill="#B3E5FC" opacity="0.7"/>
    <path d="M108 120 Q110 119 112 120 Q110 121 108 120 Z" fill="#B3E5FC" opacity="0.7"/>

    <!-- Cup rim -->
    <ellipse cx="112" cy="112" rx="12" ry="5" fill="#F0EAD8" stroke="#0D47A1" stroke-width="2"/>

    <!-- Sake in cup (amber liquid visible) -->
    <ellipse cx="112" cy="112" rx="9" ry="3.5" fill="url(#sakeAmber)" opacity="0.85"/>
    <!-- Sake surface highlight -->
    <path d="M106 111 Q110 109 115 111" fill="none" stroke="#F0D060" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- ── STEAM WISP from cup ── -->
    <path d="M110 108 Q106 98 110 88 Q114 78 110 68"
          fill="none" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round"/>

  </g>
</svg>
