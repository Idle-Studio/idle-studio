<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="tunaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C83030"/>
      <stop offset="50%" stop-color="#A01818"/>
      <stop offset="100%" stop-color="#6A0A0A"/>
    </linearGradient>
    <linearGradient id="tunaFaceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D84040"/>
      <stop offset="30%" stop-color="#E84848" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B02020"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#E8F8FF"/>
      <stop offset="50%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#7ECEF0"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFCF0"/>
      <stop offset="100%" stop-color="#EDE5CC"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="60%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── ICE BASE ── -->
    <ellipse cx="94" cy="148" rx="72" ry="28" fill="url(#iceGrad)" stroke="#7AB8D8" stroke-width="2"/>

    <!-- Ice facets / crushed ice texture -->
    <polygon points="38,142 52,136 58,148 44,152" fill="#D0F0FF" opacity="0.7"/>
    <polygon points="54,136 68,130 74,144 60,148" fill="#C8ECFF" opacity="0.6"/>
    <polygon points="110,132 124,128 130,142 116,146" fill="#D4F2FF" opacity="0.65"/>
    <polygon points="130,138 144,134 148,148 134,152" fill="#C4E8FA" opacity="0.6"/>
    <polygon points="44,152 56,148 60,158 46,160" fill="#E0F6FF" opacity="0.55"/>
    <polygon points="120,148 132,144 136,156 122,158" fill="#D8F0FF" opacity="0.55"/>
    <!-- Loose ice pieces around base -->
    <polygon points="28,148 38,144 42,154 32,156" fill="#D8F2FF" opacity="0.7"/>
    <polygon points="148,142 158,140 160,152 150,154" fill="#CCE8F8" opacity="0.65"/>
    <polygon points="70,158 80,154 84,164 72,164" fill="#E4F8FF" opacity="0.6"/>
    <!-- Ice sheen highlights -->
    <path d="M40 140 Q60 130 80 136" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M106 132 Q126 126 144 134" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- ── TUNA BLOCK (hero element) ── -->
    <!-- Back face (top edge depth) -->
    <path d="M50 90 L142 90 L148 100 L44 100 Z" fill="#8B1010" opacity="0.8"/>
    <!-- Main face of the fillet block -->
    <rect x="44" y="100" width="104" height="52" rx="4" fill="url(#tunaFaceGrad)"/>
    <!-- Top face (cuboid suggestion) -->
    <path d="M50 90 L142 90 L148 100 L44 100 Z" fill="#B82828" stroke="#7A0808" stroke-width="1.5"/>
    <!-- Side face right -->
    <path d="M148 100 L148 152 L142 156 L148 100 Z" fill="#8B1010"/>
    <!-- Main face outline -->
    <rect x="44" y="100" width="104" height="52" rx="4" fill="none" stroke="#7A0808" stroke-width="2.5"/>

    <!-- Tuna marbling lines on main face -->
    <path d="M52 110 Q76 108 100 112 Q124 116 140 112" fill="none" stroke="#E87878" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M54 120 Q78 118 102 122 Q126 126 142 122" fill="none" stroke="#E87878" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M52 130 Q74 128 98 132 Q122 136 140 132" fill="none" stroke="#CC5050" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
    <path d="M56 140 Q78 138 102 142 Q122 146 140 142" fill="none" stroke="#CC5050" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

    <!-- Tuna face sheen / diagonal highlight -->
    <path d="M48 102 Q66 98 80 108" fill="none" stroke="#EE9090" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <path d="M50 114 Q62 110 72 118" fill="none" stroke="#EE9090" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

    <!-- ── PRICE TAG ── -->
    <!-- String -->
    <path d="M140 92 Q152 84 158 76" fill="none" stroke="#8B7050" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Tag body -->
    <rect x="152" y="62" width="32" height="22" rx="3" fill="url(#tagGrad)" stroke="#8B7050" stroke-width="1.5"/>
    <!-- Tag hole -->
    <circle cx="156" cy="73" r="3" fill="none" stroke="#8B7050" stroke-width="1.5"/>
    <!-- Tag text lines (Japanese character suggestions) -->
    <line x1="161" y1="67" x2="180" y2="67" stroke="#4A3818" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="163" y1="72" x2="180" y2="72" stroke="#4A3818" stroke-width="1" stroke-linecap="round"/>
    <line x1="161" y1="77" x2="178" y2="77" stroke="#4A3818" stroke-width="1" stroke-linecap="round"/>
    <!-- Red price stamp -->
    <circle cx="173" cy="72" r="8" fill="none" stroke="#C62828" stroke-width="1.5" opacity="0.7"/>
    <text x="173" y="76" text-anchor="middle" font-size="7" fill="#C62828" font-family="sans-serif" opacity="0.8">¥</text>

    <!-- ── KNIFE BLADE (corner, bottom-right) ── -->
    <!-- Blade entering from bottom-right corner -->
    <path d="M148 178 L178 148 L182 154 L152 184 Z" fill="url(#bladeGrad)" stroke="#888888" stroke-width="1.5"/>
    <!-- Bevel line on blade -->
    <line x1="150" y1="180" x2="180" y2="150" stroke="#F0F0F0" stroke-width="1" opacity="0.7"/>
    <!-- Handle just visible at corner -->
    <path d="M174 154 L184 164 L188 172 L178 168 Z" fill="#5D3C31" stroke="#3A2018" stroke-width="1.5"/>

  </g>
</svg>
