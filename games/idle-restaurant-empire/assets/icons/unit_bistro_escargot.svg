<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>

    <!-- Plate gradient -->
    <linearGradient id="plateGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>

    <!-- Butter sauce gradient -->
    <linearGradient id="butterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4B840"/>
      <stop offset="100%" stop-color="#A88C20"/>
    </linearGradient>

    <!-- Shell gradient -->
    <radialGradient id="shellGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9A6840"/>
      <stop offset="100%" stop-color="#4A2810"/>
    </radialGradient>

    <!-- Herb pool gradient -->
    <radialGradient id="herbGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A0A850"/>
      <stop offset="100%" stop-color="#606820"/>
    </radialGradient>

    <!-- Tong gradient -->
    <linearGradient id="tongGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#AAAAAA"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── PLATE ── -->
    <!-- Plate shadow rim -->
    <circle cx="97" cy="100" r="68" fill="#C8B8A0" opacity="0.4"/>
    <!-- Plate base -->
    <circle cx="96" cy="98" r="68" fill="url(#plateGrad)" stroke="#8B1A3A" stroke-width="3"/>
    <!-- Plate inner rim ring -->
    <circle cx="96" cy="98" r="60" fill="none" stroke="#8B1A3A" stroke-width="1.2" opacity="0.4"/>
    <!-- Plate innermost recess -->
    <circle cx="96" cy="98" r="52" fill="none" stroke="#C8B090" stroke-width="1" opacity="0.5"/>

    <!-- ── BUTTER SAUCE POOL ── -->
    <ellipse cx="96" cy="100" rx="44" ry="38"
             fill="url(#butterGrad)" opacity="0.55"/>

    <!-- ── 6 SNAILS — 2 rows of 3 ── -->
    <!-- Row 1: y≈82 -->
    <!-- Snail 1 -->
    <ellipse cx="66" cy="82" rx="12" ry="9" fill="url(#herbGrad)" opacity="0.85"/>
    <circle  cx="66" cy="82" r="8"   fill="url(#shellGrad)" stroke="#3A1A08" stroke-width="1.5"/>
    <path d="M66 76 Q72 76 72 82 Q72 88 66 88 Q62 88 62 84 Q62 80 66 80"
          fill="none" stroke="#7A4820" stroke-width="1.2" opacity="0.8"/>
    <circle cx="66" cy="82" r="2.5" fill="#2A1008" opacity="0.6"/>

    <!-- Snail 2 -->
    <ellipse cx="96" cy="79" rx="12" ry="9" fill="url(#herbGrad)" opacity="0.85"/>
    <circle  cx="96" cy="79" r="8"   fill="url(#shellGrad)" stroke="#3A1A08" stroke-width="1.5"/>
    <path d="M96 73 Q102 73 102 79 Q102 85 96 85 Q92 85 92 81 Q92 77 96 77"
          fill="none" stroke="#7A4820" stroke-width="1.2" opacity="0.8"/>
    <circle cx="96" cy="79" r="2.5" fill="#2A1008" opacity="0.6"/>

    <!-- Snail 3 -->
    <ellipse cx="126" cy="82" rx="12" ry="9" fill="url(#herbGrad)" opacity="0.85"/>
    <circle  cx="126" cy="82" r="8"   fill="url(#shellGrad)" stroke="#3A1A08" stroke-width="1.5"/>
    <path d="M126 76 Q132 76 132 82 Q132 88 126 88 Q122 88 122 84 Q122 80 126 80"
          fill="none" stroke="#7A4820" stroke-width="1.2" opacity="0.8"/>
    <circle cx="126" cy="82" r="2.5" fill="#2A1008" opacity="0.6"/>

    <!-- Row 2: y≈108 -->
    <!-- Snail 4 -->
    <ellipse cx="66" cy="110" rx="12" ry="9" fill="url(#herbGrad)" opacity="0.85"/>
    <circle  cx="66" cy="110" r="8"   fill="url(#shellGrad)" stroke="#3A1A08" stroke-width="1.5"/>
    <path d="M66 104 Q72 104 72 110 Q72 116 66 116 Q62 116 62 112 Q62 108 66 108"
          fill="none" stroke="#7A4820" stroke-width="1.2" opacity="0.8"/>
    <circle cx="66" cy="110" r="2.5" fill="#2A1008" opacity="0.6"/>

    <!-- Snail 5 -->
    <ellipse cx="96" cy="113" rx="12" ry="9" fill="url(#herbGrad)" opacity="0.85"/>
    <circle  cx="96" cy="113" r="8"   fill="url(#shellGrad)" stroke="#3A1A08" stroke-width="1.5"/>
    <path d="M96 107 Q102 107 102 113 Q102 119 96 119 Q92 119 92 115 Q92 111 96 111"
          fill="none" stroke="#7A4820" stroke-width="1.2" opacity="0.8"/>
    <circle cx="96" cy="113" r="2.5" fill="#2A1008" opacity="0.6"/>

    <!-- Snail 6 -->
    <ellipse cx="126" cy="110" rx="12" ry="9" fill="url(#herbGrad)" opacity="0.85"/>
    <circle  cx="126" cy="110" r="8"   fill="url(#shellGrad)" stroke="#3A1A08" stroke-width="1.5"/>
    <path d="M126 104 Q132 104 132 110 Q132 116 126 116 Q122 116 122 112 Q122 108 126 108"
          fill="none" stroke="#7A4820" stroke-width="1.2" opacity="0.8"/>
    <circle cx="126" cy="110" r="2.5" fill="#2A1008" opacity="0.6"/>

    <!-- ── PARSLEY GARNISH ── -->
    <g fill="#4A8020" opacity="0.9">
      <!-- 3 small leaf shapes -->
      <ellipse cx="96" cy="131" rx="5" ry="3" transform="rotate(-30,96,131)"/>
      <ellipse cx="104" cy="128" rx="5" ry="3" transform="rotate(20,104,128)"/>
      <ellipse cx="88" cy="129" rx="5" ry="3" transform="rotate(10,88,129)"/>
      <!-- Stems -->
      <line x1="96" y1="131" x2="96" y2="136" stroke="#3A6010" stroke-width="1"/>
      <line x1="104" y1="128" x2="100" y2="136" stroke="#3A6010" stroke-width="1"/>
      <line x1="88" y1="129" x2="92" y2="136" stroke="#3A6010" stroke-width="1"/>
    </g>

    <!-- ── TONGS ── -->
    <!-- Pivot point at lower-right -->
    <!-- Arm 1: upper left -->
    <rect x="112" y="55" width="7" height="56" rx="3.5"
          fill="url(#tongGrad)" stroke="#555555" stroke-width="1.5"
          transform="rotate(35, 130, 138)"/>
    <!-- Arm 2: upper left slightly offset -->
    <rect x="122" y="55" width="7" height="56" rx="3.5"
          fill="url(#tongGrad)" stroke="#555555" stroke-width="1.5"
          transform="rotate(42, 130, 138)"/>
    <!-- Pivot rivet -->
    <circle cx="130" cy="138" r="4.5" fill="#888888" stroke="#444444" stroke-width="1.5"/>
    <circle cx="130" cy="138" r="2"   fill="#BBBBBB"/>
    <!-- Grip ends at top -->
    <circle cx="87"  cy="43" r="4.5" fill="#AAAAAA" stroke="#555555" stroke-width="1.5"/>
    <circle cx="78"  cy="39" r="4.5" fill="#AAAAAA" stroke="#555555" stroke-width="1.5"/>

  </g>
</svg>
