<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>

    <!-- Wall gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#EDE0C8"/>
    </linearGradient>

    <!-- Pass/counter gradient -->
    <linearGradient id="passGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A82048"/>
      <stop offset="100%" stop-color="#5E1028"/>
    </linearGradient>

    <!-- Copper pan gradients -->
    <radialGradient id="copperGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E89848"/>
      <stop offset="100%" stop-color="#9A5018"/>
    </radialGradient>
    <radialGradient id="copperGrad2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D88838"/>
      <stop offset="100%" stop-color="#884010"/>
    </radialGradient>

    <!-- Rack rod gradient -->
    <linearGradient id="rodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#686868"/>
      <stop offset="100%" stop-color="#2A2A2A"/>
    </linearGradient>

    <!-- Chef coat gradient -->
    <linearGradient id="coatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </linearGradient>

    <!-- Toque gradient -->
    <linearGradient id="toqueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>

    <!-- Flame gradient -->
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FFEE40"/>
      <stop offset="60%" stop-color="#FF8020"/>
      <stop offset="100%" stop-color="#CC2000"/>
    </radialGradient>

    <!-- Counter top gradient -->
    <linearGradient id="counterTopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0C8D0"/>
      <stop offset="100%" stop-color="#909898"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── KITCHEN WALL ── -->
    <rect x="20" y="22" width="152" height="152" rx="6"
          fill="url(#wallGrad)" stroke="#C8B890" stroke-width="2"/>
    <!-- Tile grid suggestion on wall -->
    <g stroke="#DDD0B0" stroke-width="0.8" opacity="0.5">
      <line x1="20" y1="46" x2="172" y2="46"/>
      <line x1="20" y1="70" x2="172" y2="70"/>
      <line x1="58" y1="22" x2="58" y2="120"/>
      <line x1="96" y1="22" x2="96" y2="120"/>
      <line x1="134" y1="22" x2="134" y2="120"/>
    </g>

    <!-- ── HANGING ROD ── -->
    <rect x="34" y="38" width="102" height="8" rx="4"
          fill="url(#rodGrad)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Rod highlight -->
    <rect x="34" y="39" width="102" height="3" rx="1.5" fill="white" opacity="0.2"/>
    <!-- Wall bracket left -->
    <rect x="30" y="30" width="10" height="20" rx="3" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Wall bracket right -->
    <rect x="132" y="30" width="10" height="20" rx="3" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="1.5"/>

    <!-- ── S-HOOKS ── -->
    <path d="M55 46 Q58 46 58 50 Q58 56 62 56 Q66 56 66 52 Q66 48 70 48"
          fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
    <path d="M78 46 Q81 46 81 50 Q81 56 85 56 Q89 56 89 52 Q89 48 93 48"
          fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
    <path d="M100 46 Q103 46 103 50 Q103 56 107 56 Q111 56 111 52 Q111 48 115 48"
          fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"/>
    <path d="M117 46 Q120 46 120 50 Q120 56 124 56 Q128 56 128 52 Q128 48 132 48"
          fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"/>

    <!-- ── HANGING COPPER PANS ── -->
    <!-- Pan 1 (leftmost, r=12) -->
    <g transform="translate(62, 70)">
      <rect x="-3" y="-30" width="5" height="14" rx="2" fill="#6A4020" stroke="#3A2010" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="12" fill="url(#copperGrad)" stroke="#7A3810" stroke-width="2"/>
      <ellipse cx="-3" cy="-4" rx="5" ry="3" fill="white" opacity="0.18"/>
      <rect x="12" y="-3" width="18" height="5" rx="2.5" fill="#8B5020" stroke="#5A2810" stroke-width="1.5"/>
      <!-- Inner ring -->
      <circle cx="0" cy="0" r="8" fill="none" stroke="#B06828" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Pan 2 (r=14) -->
    <g transform="translate(89, 73)">
      <rect x="-3" y="-30" width="5" height="17" rx="2" fill="#6A4020" stroke="#3A2010" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="14" fill="url(#copperGrad2)" stroke="#7A3810" stroke-width="2"/>
      <ellipse cx="-4" cy="-5" rx="6" ry="4" fill="white" opacity="0.16"/>
      <rect x="14" y="-3" width="20" height="5" rx="2.5" fill="#8B5020" stroke="#5A2810" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#B06828" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Pan 3 (r=10) — small sauté pan -->
    <g transform="translate(116, 68)">
      <rect x="-2" y="-26" width="4" height="12" rx="2" fill="#6A4020" stroke="#3A2010" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="10" fill="url(#copperGrad)" stroke="#7A3810" stroke-width="2"/>
      <ellipse cx="-3" cy="-3" rx="4" ry="2.5" fill="white" opacity="0.18"/>
      <rect x="10" y="-3" width="16" height="5" rx="2.5" fill="#8B5020" stroke="#5A2810" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#B06828" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Pan 4 (r=12, leftmost with long handle going left) -->
    <g transform="translate(40, 72)">
      <rect x="-2" y="-28" width="4" height="14" rx="2" fill="#6A4020" stroke="#3A2010" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="11" fill="url(#copperGrad2)" stroke="#7A3810" stroke-width="2"/>
      <ellipse cx="-3" cy="-4" rx="4" ry="2.5" fill="white" opacity="0.16"/>
      <rect x="-28" y="-3" width="18" height="5" rx="2.5" fill="#8B5020" stroke="#5A2810" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#B06828" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- ── PASS / COUNTER ── -->
    <rect x="20" y="126" width="152" height="48" rx="0"
          fill="url(#passGrad)" stroke="#3A0818" stroke-width="2"/>
    <!-- Counter top surface -->
    <rect x="20" y="122" width="152" height="10" rx="3"
          fill="url(#counterTopGrad)" stroke="#606868" stroke-width="1.5"/>
    <!-- Counter top highlight -->
    <rect x="22" y="122" width="148" height="3" rx="1.5" fill="white" opacity="0.22"/>

    <!-- ── CHEF SILHOUETTE (right side, behind counter top) ── -->
    <!-- Chef body/coat -->
    <path d="M128 90 Q122 92 118 100 L118 126 L148 126 L148 100 Q144 92 138 90 Z"
          fill="url(#coatGrad)" stroke="#B8B8B8" stroke-width="1.5"/>
    <!-- Double-breasted buttons -->
    <circle cx="129" cy="108" r="2.5" fill="#8B1A3A"/>
    <circle cx="129" cy="116" r="2.5" fill="#8B1A3A"/>
    <circle cx="137" cy="108" r="2.5" fill="#8B1A3A"/>
    <circle cx="137" cy="116" r="2.5" fill="#8B1A3A"/>
    <!-- Collar -->
    <path d="M128 90 Q133 95 133 90 Q133 95 138 90"
          fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
    <!-- Chef head -->
    <ellipse cx="133" cy="82" rx="11" ry="12" fill="#F0C8A0" stroke="#C8906060" stroke-width="1.5"/>
    <!-- Toque base cylinder -->
    <rect x="122" y="52" width="22" height="24" rx="4"
          fill="url(#toqueGrad)" stroke="#C0C0C0" stroke-width="1.5"/>
    <!-- Toque puffed top -->
    <ellipse cx="133" cy="50" rx="14" ry="10"
             fill="url(#toqueGrad)" stroke="#C0C0C0" stroke-width="1.5"/>
    <!-- Toque band -->
    <rect x="122" y="72" width="22" height="5" rx="0"
          fill="#E0E0E0" stroke="#B0B0B0" stroke-width="1"/>

    <!-- ── FLAME on pass / cooktop ── -->
    <!-- Cooktop hint on counter top -->
    <ellipse cx="72" cy="124" rx="18" ry="5"
             fill="#404040" stroke="#202020" stroke-width="1"/>
    <!-- Flame -->
    <path d="M72 122 Q68 114 72 108 Q70 114 76 110 Q74 115 78 111 Q76 118 80 114 Q78 120 74 122 Z"
          fill="url(#flameGrad)" opacity="0.95"/>
    <path d="M72 122 Q76 115 72 110 Q74 116 70 113 Z"
          fill="#FFEE80" opacity="0.7"/>

    <!-- Glow from flame -->
    <ellipse cx="72" cy="118" rx="12" ry="8" fill="#FF8020" opacity="0.12"/>

  </g>
</svg>
