<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="tableGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#5A1A1A"/>
      <stop offset="100%" stop-color="#3A1010"/>
    </linearGradient>
    <linearGradient id="lazyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F8D860"/>
      <stop offset="60%" stop-color="#F0C040"/>
      <stop offset="100%" stop-color="#C09020"/>
    </linearGradient>
    <radialGradient id="tableSheen" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7A2828" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3A1010" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ══════════════════════════════════
         TABLE — dark lacquered circle
    ══════════════════════════════════ -->
    <circle cx="96" cy="96" r="84" fill="url(#tableGrad)" stroke="#5A0808" stroke-width="3"/>
    <!-- Wood grain lines on table -->
    <ellipse cx="96" cy="96" rx="70" ry="70" fill="none" stroke="#4A1414" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="96" cy="96" rx="56" ry="56" fill="none" stroke="#4A1414" stroke-width="1"   opacity="0.4"/>
    <!-- Radial grain lines -->
    <line x1="96" y1="12" x2="96" y2="30"  stroke="#4A1414" stroke-width="1" opacity="0.35"/>
    <line x1="96" y1="162" x2="96" y2="180" stroke="#4A1414" stroke-width="1" opacity="0.35"/>
    <line x1="12" y1="96" x2="30" y2="96"  stroke="#4A1414" stroke-width="1" opacity="0.35"/>
    <line x1="162" y1="96" x2="180" y2="96" stroke="#4A1414" stroke-width="1" opacity="0.35"/>
    <!-- Sheen highlight -->
    <circle cx="96" cy="96" r="84" fill="url(#tableSheen)"/>

    <!-- ══════════════════════════════════
         TABLECLOTH — cream with red border
    ══════════════════════════════════ -->
    <circle cx="96" cy="96" r="72" fill="#F5EDD8" stroke="#C62828" stroke-width="4"/>
    <!-- Inner decorative red embroidery ring -->
    <circle cx="96" cy="96" r="67" fill="none" stroke="#C62828" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Outer embroidery pattern — small diamond shapes (simplified as marks) -->
    <!-- Top -->
    <path d="M96 24 L99 28 L96 32 L93 28 Z" fill="#C62828"/>
    <path d="M112 26 L115 30 L112 34 L109 30 Z" fill="#C62828"/>
    <path d="M80 26 L83 30 L80 34 L77 30 Z" fill="#C62828"/>
    <!-- Right -->
    <path d="M168 96 L164 99 L160 96 L164 93 Z" fill="#C62828"/>
    <path d="M166 112 L162 115 L158 112 L162 109 Z" fill="#C62828"/>
    <path d="M166 80 L162 83 L158 80 L162 77 Z" fill="#C62828"/>
    <!-- Bottom -->
    <path d="M96 168 L99 164 L96 160 L93 164 Z" fill="#C62828"/>
    <path d="M112 166 L115 162 L112 158 L109 162 Z" fill="#C62828"/>
    <path d="M80 166 L83 162 L80 158 L77 162 Z" fill="#C62828"/>
    <!-- Left -->
    <path d="M24 96 L28 99 L32 96 L28 93 Z" fill="#C62828"/>
    <path d="M26 112 L30 115 L34 112 L30 109 Z" fill="#C62828"/>
    <path d="M26 80 L30 83 L34 80 L30 77 Z" fill="#C62828"/>

    <!-- ══════════════════════════════════
         LAZY SUSAN — gold-rimmed center disc
    ══════════════════════════════════ -->
    <circle cx="96" cy="96" r="40" fill="#F5EDD8" stroke="url(#lazyGrad)" stroke-width="5"/>
    <!-- Inner gold ring -->
    <circle cx="96" cy="96" r="35" fill="none" stroke="#F0C040" stroke-width="2" opacity="0.6"/>
    <!-- Center motif — red circle -->
    <circle cx="96" cy="96" r="10" fill="#C62828" stroke="#F0C040" stroke-width="2"/>
    <circle cx="96" cy="96" r="6"  fill="#F0C040"/>
    <!-- Double happiness character suggestion (simplified lines) -->
    <line x1="93" y1="93" x2="93" y2="99" stroke="#C62828" stroke-width="1.5"/>
    <line x1="99" y1="93" x2="99" y2="99" stroke="#C62828" stroke-width="1.5"/>
    <line x1="91" y1="95" x2="101" y2="95" stroke="#C62828" stroke-width="1.5"/>

    <!-- ══════════════════════════════════
         8 DISHES on lazy susan and tablecloth
         Arranged in a ring at r~28 from center
    ══════════════════════════════════ -->
    <!-- Dish 1 — top (white plate, red sauce dish) -->
    <ellipse cx="96" cy="62" rx="10" ry="7" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
    <ellipse cx="96" cy="62" rx="6"  ry="4" fill="#C62828" opacity="0.7"/>

    <!-- Dish 2 — top-right (green veg) -->
    <ellipse cx="118" cy="70" rx="10" ry="7" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
    <ellipse cx="118" cy="70" rx="7"  ry="4.5" fill="#5A9030" opacity="0.8"/>
    <ellipse cx="116" cy="69" rx="3"  ry="2"   fill="#80B050" opacity="0.6"/>

    <!-- Dish 3 — right (dark duck/meat) -->
    <ellipse cx="128" cy="92" rx="10" ry="7" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
    <ellipse cx="128" cy="92" rx="7"  ry="4.5" fill="#6B2010" opacity="0.85"/>
    <ellipse cx="126" cy="91" rx="3"  ry="2"   fill="#9A4020" opacity="0.5"/>

    <!-- Dish 4 — bottom-right (steamer basket top view) -->
    <ellipse cx="118" cy="122" rx="10" ry="7" fill="#C89050" stroke="#7A5020" stroke-width="1.5"/>
    <ellipse cx="118" cy="122" rx="7"  ry="4.5" fill="#4A2C0A"/>
    <ellipse cx="116" cy="122" rx="2.5" ry="2" fill="#F5EDD8"/>
    <ellipse cx="120" cy="122" rx="2.5" ry="2" fill="#F5EDD8"/>

    <!-- Dish 5 — bottom (soup bowl) -->
    <ellipse cx="96" cy="132" rx="10" ry="7" fill="#EDE0C8" stroke="#B8A888" stroke-width="1.5"/>
    <ellipse cx="96" cy="131" rx="7"  ry="4.5" fill="#C07010" opacity="0.7"/>

    <!-- Dish 6 — bottom-left (har gow, pink) -->
    <ellipse cx="74" cy="122" rx="10" ry="7" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
    <ellipse cx="72" cy="122" rx="4"  ry="3" fill="#F0A0A0" stroke="#C88080" stroke-width="1"/>
    <ellipse cx="77" cy="122" rx="4"  ry="3" fill="#F0A0A0" stroke="#C88080" stroke-width="1"/>

    <!-- Dish 7 — left (bao buns white) -->
    <ellipse cx="64" cy="92" rx="10" ry="7" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
    <ellipse cx="62" cy="91" rx="4"  ry="4" fill="#F5EDD8" stroke="#D4C0A0" stroke-width="1"/>
    <ellipse cx="67" cy="93" rx="4"  ry="4" fill="#F5EDD8" stroke="#D4C0A0" stroke-width="1"/>

    <!-- Dish 8 — top-left (noodle dish, yellow) -->
    <ellipse cx="74" cy="70" rx="10" ry="7" fill="white" stroke="#DDDDDD" stroke-width="1.5"/>
    <path d="M67 70 Q72 66 77 70 Q72 74 67 70 Z" fill="#D4A040" opacity="0.8"/>
    <path d="M69 68 Q74 72 79 68" fill="none" stroke="#C09030" stroke-width="1.5"/>

    <!-- ══════════════════════════════════
         8 PLACE SETTINGS around table edge
    ══════════════════════════════════ -->
    <!-- Each setting: pair of chopsticks + red napkin triangle -->
    <!-- Setting 1 — top -->
    <line x1="92" y1="27" x2="90" y2="42" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="97" y1="27" x2="95" y2="42" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M89 23 L96 23 L92 31 Z" fill="#C62828"/>

    <!-- Setting 2 — top-right -->
    <line x1="129" y1="36" x2="122" y2="49" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="133" y1="39" x2="126" y2="52" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M128 31 L136 35 L130 42 Z" fill="#C62828"/>

    <!-- Setting 3 — right -->
    <line x1="156" y1="91" x2="143" y2="94" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="156" y1="97" x2="143" y2="99" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M159 88 L165 96 L157 101 Z" fill="#C62828"/>

    <!-- Setting 4 — bottom-right -->
    <line x1="133" y1="153" x2="126" y2="141" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="129" y1="156" x2="122" y2="144" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M128 161 L136 157 L131 150 Z" fill="#C62828"/>

    <!-- Setting 5 — bottom -->
    <line x1="92" y1="165" x2="90" y2="152" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="97" y1="165" x2="95" y2="152" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M89 169 L96 169 L92 162 Z" fill="#C62828"/>

    <!-- Setting 6 — bottom-left -->
    <line x1="59" y1="153" x2="66" y2="141" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="63" y1="156" x2="70" y2="144" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M64 161 L56 157 L61 150 Z" fill="#C62828"/>

    <!-- Setting 7 — left -->
    <line x1="36" y1="91" x2="49" y2="94" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="97" x2="49" y2="99" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M33 88 L27 96 L35 101 Z" fill="#C62828"/>

    <!-- Setting 8 — top-left -->
    <line x1="59" y1="36" x2="66" y2="49" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="63" y1="39" x2="70" y2="52" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M64 31 L56 35 L62 42 Z" fill="#C62828"/>

  </g>
</svg>
