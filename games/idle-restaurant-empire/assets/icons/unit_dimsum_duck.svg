<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="duckBody" x1="10%" y1="5%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#9A4020"/>
      <stop offset="35%" stop-color="#6B2010"/>
      <stop offset="100%" stop-color="#3A1008"/>
    </linearGradient>
    <linearGradient id="duckShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C05830" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9A4020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCCCCC"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B3A18"/>
      <stop offset="100%" stop-color="#5A2008"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ══════════════════════════════════
         HOOK & CHAIN at top
    ══════════════════════════════════ -->
    <!-- Mounting bar -->
    <rect x="80" y="14" width="32" height="6" rx="3" fill="url(#hookGrad)" stroke="#555555" stroke-width="1.5"/>
    <!-- Chain links -->
    <ellipse cx="96" cy="24"  rx="5" ry="4" fill="none" stroke="#888888" stroke-width="2.5"/>
    <ellipse cx="96" cy="32"  rx="4" ry="5" fill="none" stroke="#888888" stroke-width="2.5"/>
    <ellipse cx="96" cy="41"  rx="5" ry="4" fill="none" stroke="#888888" stroke-width="2.5"/>
    <!-- S-hook -->
    <path d="M96 49 Q102 49 104 53 Q106 57 102 59 Q98 61 98 65 Q98 69 102 69" fill="none" stroke="#999999" stroke-width="3" stroke-linecap="round"/>
    <!-- Hook shine -->
    <path d="M97 50 Q101 51 103 54" fill="none" stroke="#DDDDDD" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- ══════════════════════════════════
         DUCK BODY — large hanging roast shape
    ══════════════════════════════════ -->
    <!-- Main body (irregular roast duck silhouette, vertically oriented) -->
    <path d="
      M96 72
      Q118 72 128 82
      Q142 96 140 116
      Q140 136 130 150
      Q120 164 96 166
      Q72 164 62 150
      Q52 136 52 116
      Q50 96 64 82
      Q74 72 96 72 Z
    " fill="url(#duckBody)" stroke="#2A0808" stroke-width="3"/>

    <!-- Glossy lacquer highlight — top-left curved patch -->
    <path d="
      M72 78
      Q88 72 104 78
      Q114 84 112 96
      Q108 106 96 108
      Q80 106 74 96
      Q68 86 72 78 Z
    " fill="url(#duckShine)" opacity="0.7"/>

    <!-- Secondary smaller highlight fleck -->
    <ellipse cx="78" cy="84" rx="9" ry="6" fill="#C05830" opacity="0.35" transform="rotate(-20 78 84)"/>

    <!-- ══════════════════════════════════
         WING TIPS — slightly raised on sides
    ══════════════════════════════════ -->
    <!-- Left wing -->
    <path d="M54 108 Q44 100 46 88 Q48 80 56 84 Q62 90 62 100 Z" fill="url(#wingGrad)" stroke="#3A1008" stroke-width="2"/>
    <path d="M56 96 Q50 90 52 84" fill="none" stroke="#9A5028" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Right wing -->
    <path d="M138 108 Q148 100 146 88 Q144 80 136 84 Q130 90 130 100 Z" fill="url(#wingGrad)" stroke="#3A1008" stroke-width="2"/>
    <path d="M136 96 Q142 90 140 84" fill="none" stroke="#9A5028" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- ══════════════════════════════════
         DRUMSTICK ENDS — bottom legs, lighter
    ══════════════════════════════════ -->
    <!-- Left drumstick bone end -->
    <path d="M75 164 Q68 172 66 180 Q70 185 76 182 Q80 178 78 170 Z" fill="#8B3A18" stroke="#5A1808" stroke-width="2"/>
    <ellipse cx="72" cy="180" rx="6" ry="4" fill="#C07030" stroke="#8B3A18" stroke-width="1.5"/>
    <!-- Right drumstick bone end -->
    <path d="M117 164 Q124 172 126 180 Q122 185 116 182 Q112 178 114 170 Z" fill="#8B3A18" stroke="#5A1808" stroke-width="2"/>
    <ellipse cx="120" cy="180" rx="6" ry="4" fill="#C07030" stroke="#8B3A18" stroke-width="1.5"/>

    <!-- ══════════════════════════════════
         GLAZE DRIP — honey-soy amber line
    ══════════════════════════════════ -->
    <!-- Main drip streak -->
    <path d="M118 90 Q122 110 120 130 Q119 148 118 162" fill="none" stroke="#D4A020" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- Drip bead -->
    <ellipse cx="118" cy="164" rx="4" ry="6" fill="#D4A020" opacity="0.9"/>
    <!-- Secondary thin drip -->
    <path d="M108 96 Q112 118 110 140" fill="none" stroke="#C09020" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- ══════════════════════════════════
         SURFACE TEXTURE — subtle skin lines
    ══════════════════════════════════ -->
    <path d="M78 102 Q88 100 98 103 Q108 106 114 104" fill="none" stroke="#5A1808" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M72 118 Q84 116 96 118 Q108 120 120 118" fill="none" stroke="#5A1808" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M74 134 Q86 132 96 134 Q108 136 118 134" fill="none" stroke="#5A1808" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- ══════════════════════════════════
         RED PRICE TAG on duck (accent)
    ══════════════════════════════════ -->
    <rect x="56" y="130" width="22" height="14" rx="3" fill="#C62828" stroke="#8C1010" stroke-width="1.5"/>
    <line x1="67" y1="130" x2="67" y2="126" stroke="#888888" stroke-width="1.5"/>
    <circle cx="67" cy="125" r="2.5" fill="none" stroke="#888888" stroke-width="1.5"/>
    <!-- Tag text lines (implied) -->
    <line x1="60" y1="136" x2="74" y2="136" stroke="#F0C040" stroke-width="1.5"/>
    <line x1="61" y1="140" x2="73" y2="140" stroke="#F0C040" stroke-width="1"/>

  </g>
</svg>
