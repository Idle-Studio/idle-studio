<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A860"/>
      <stop offset="100%" stop-color="#A87030"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D070"/>
      <stop offset="100%" stop-color="#C09020"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B050"/>
      <stop offset="100%" stop-color="#9A6020"/>
    </linearGradient>
    <clipPath id="c3"><rect x="36" y="138" width="120" height="24"/></clipPath>
    <clipPath id="c2"><rect x="36" y="110" width="120" height="28"/></clipPath>
    <clipPath id="c1"><rect x="36" y="83"  width="120" height="27"/></clipPath>
  </defs>

  <g filter="url(#ds)">

    <!-- ══════════════════════════════════
         BASKET 3 — BOTTOM (widest)
    ══════════════════════════════════ -->
    <rect x="36" y="138" width="120" height="24" fill="url(#basketGrad)"/>
    <g clip-path="url(#c3)">
      <line x1="52"  y1="138" x2="52"  y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="66"  y1="138" x2="66"  y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="80"  y1="138" x2="80"  y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="94"  y1="138" x2="94"  y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="108" y1="138" x2="108" y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="122" y1="138" x2="122" y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="136" y1="138" x2="136" y2="162" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
    </g>
    <!-- Red ribbon around basket 3 -->
    <rect x="36" y="148" width="120" height="5" fill="#C62828" opacity="0.85"/>
    <!-- Bottom ellipse -->
    <ellipse cx="96" cy="162" rx="60" ry="11" fill="#9A6828" stroke="#6A4010" stroke-width="2"/>
    <!-- Gold rim bottom -->
    <ellipse cx="96" cy="138" rx="62" ry="12" fill="url(#rimGrad)" stroke="#C09020" stroke-width="2.5"/>
    <!-- Outline sides -->
    <path d="M36 138 L36 162 M156 138 L156 162" stroke="#7A5020" stroke-width="2"/>

    <!-- ══════════════════════════════════
         BASKET 2 — MIDDLE
    ══════════════════════════════════ -->
    <rect x="36" y="110" width="120" height="28" fill="url(#basketGrad)"/>
    <g clip-path="url(#c2)">
      <line x1="52"  y1="110" x2="52"  y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="66"  y1="110" x2="66"  y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="80"  y1="110" x2="80"  y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="94"  y1="110" x2="94"  y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="108" y1="110" x2="108" y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="122" y1="110" x2="122" y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="136" y1="110" x2="136" y2="138" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
    </g>
    <!-- Red ribbon around basket 2 -->
    <rect x="36" y="121" width="120" height="5" fill="#C62828" opacity="0.85"/>
    <!-- Gold rim top of basket 2 -->
    <ellipse cx="96" cy="110" rx="62" ry="12" fill="url(#rimGrad)" stroke="#C09020" stroke-width="2.5"/>
    <path d="M36 110 L36 138 M156 110 L156 138" stroke="#7A5020" stroke-width="2"/>

    <!-- ══════════════════════════════════
         BASKET 1 — TOP (open, showing dim sum)
    ══════════════════════════════════ -->
    <rect x="36" y="83" width="120" height="27" fill="url(#basketGrad)"/>
    <g clip-path="url(#c1)">
      <line x1="52"  y1="83" x2="52"  y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="66"  y1="83" x2="66"  y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="80"  y1="83" x2="80"  y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="94"  y1="83" x2="94"  y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="108" y1="83" x2="108" y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="122" y1="83" x2="122" y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
      <line x1="136" y1="83" x2="136" y2="110" stroke="#7A5018" stroke-width="1.5" opacity="0.55"/>
    </g>
    <!-- Red ribbon around basket 1 -->
    <rect x="36" y="94" width="120" height="5" fill="#C62828" opacity="0.85"/>
    <!-- Dark interior -->
    <ellipse cx="96" cy="83" rx="56" ry="10" fill="#4A2C0A"/>
    <!-- Dim sum items inside: round bao (left), dumpling (center), siu mai (right), bao (far right) -->
    <!-- Bao left -->
    <ellipse cx="67" cy="93" rx="13" ry="10" fill="#F5EDD8" stroke="#D4C0A0" stroke-width="1.5"/>
    <path d="M57 89 Q67 84 77 89" fill="none" stroke="#C4B090" stroke-width="1.5"/>
    <circle cx="67" cy="87" r="3" fill="#C62828" opacity="0.7"/>
    <!-- Dumpling center-left -->
    <ellipse cx="85" cy="96" rx="11" ry="8" fill="#F0E8D0" stroke="#C8B080" stroke-width="1.5"/>
    <path d="M75 96 Q85 89 95 96" fill="none" stroke="#C0A878" stroke-width="1.5"/>
    <!-- Siu mai center-right -->
    <ellipse cx="107" cy="93" rx="11" ry="10" fill="#F5C080" stroke="#D4A060" stroke-width="1.5"/>
    <circle cx="107" cy="88" r="4" fill="#C86820" opacity="0.6"/>
    <!-- Har gow right -->
    <ellipse cx="126" cy="96" rx="11" ry="8" fill="#F0E0E8" stroke="#C0A0B0" stroke-width="1.5"/>
    <path d="M116 96 Q126 89 136 96" fill="none" stroke="#B898A8" stroke-width="1.5"/>
    <!-- Gold rim top of basket 1 -->
    <ellipse cx="96" cy="83" rx="62" ry="12" fill="url(#rimGrad)" stroke="#C09020" stroke-width="3"/>
    <path d="M36 83 L36 110 M156 83 L156 110" stroke="#7A5020" stroke-width="2"/>

    <!-- ══════════════════════════════════
         LID — domed bamboo with gold knob
    ══════════════════════════════════ -->
    <!-- Lid base rim (gold) -->
    <ellipse cx="96" cy="79" rx="64" ry="13" fill="url(#rimGrad)" stroke="#C09020" stroke-width="3"/>
    <!-- Lower dome -->
    <path d="M46 77 Q50 63 96 60 Q142 63 146 77 Z" fill="url(#lidGrad)" stroke="#8A6020" stroke-width="2.5"/>
    <ellipse cx="96" cy="60" rx="50" ry="10" fill="#D4A050" stroke="#8A6020" stroke-width="2"/>
    <!-- Upper dome -->
    <path d="M60 59 Q64 46 96 43 Q128 46 132 59 Z" fill="#E0B060" stroke="#9A7028" stroke-width="2"/>
    <ellipse cx="96" cy="43" rx="36" ry="8" fill="#E0B060" stroke="#9A7028" stroke-width="2"/>
    <!-- Knob tier -->
    <ellipse cx="96" cy="38" rx="18" ry="7" fill="#F0C850" stroke="#C09020" stroke-width="2"/>
    <ellipse cx="96" cy="33" rx="12" ry="6" fill="#F8D870" stroke="#C09020" stroke-width="2"/>
    <!-- Red decorative circle on knob -->
    <circle cx="96" cy="31" r="4" fill="#C62828"/>
    <circle cx="96" cy="31" r="2" fill="#F0C040"/>

    <!-- ── STEAM WISPS ── -->
    <path d="M76 22 Q72 12 76 4"  fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M96 18 Q92 8 96 1"   fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M116 22 Q112 12 116 4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M86 20 Q82 10 86 2"  fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  </g>
</svg>
