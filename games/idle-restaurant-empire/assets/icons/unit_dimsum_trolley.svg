<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A8A8A"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F0E0"/>
      <stop offset="100%" stop-color="#DDD0B8"/>
    </linearGradient>
    <linearGradient id="lacquerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A2020"/>
      <stop offset="100%" stop-color="#3A1010"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ══════════════════════════════════
         WHEELS — 4 corners, slight 3/4 view
    ══════════════════════════════════ -->
    <!-- Front-left wheel -->
    <ellipse cx="44" cy="158" rx="11" ry="11" fill="#4A4A4A" stroke="#222222" stroke-width="2.5"/>
    <ellipse cx="44" cy="158" rx="6"  ry="6"  fill="#6A6A6A"/>
    <circle  cx="44" cy="158" r="2"  fill="#9A9A9A"/>
    <!-- Front-right wheel -->
    <ellipse cx="148" cy="158" rx="11" ry="11" fill="#4A4A4A" stroke="#222222" stroke-width="2.5"/>
    <ellipse cx="148" cy="158" rx="6"  ry="6"  fill="#6A6A6A"/>
    <circle  cx="148" cy="158" r="2"  fill="#9A9A9A"/>
    <!-- Rear-left wheel (partially hidden) -->
    <ellipse cx="50" cy="148" rx="9" ry="9" fill="#383838" stroke="#202020" stroke-width="2"/>
    <circle  cx="50" cy="148" r="4" fill="#505050"/>
    <!-- Rear-right wheel (partially hidden) -->
    <ellipse cx="142" cy="148" rx="9" ry="9" fill="#383838" stroke="#202020" stroke-width="2"/>
    <circle  cx="142" cy="148" r="4" fill="#505050"/>

    <!-- ══════════════════════════════════
         CART FRAME — rod construction
    ══════════════════════════════════ -->
    <!-- Lower cross-bar -->
    <rect x="44" y="150" width="104" height="5" rx="2.5" fill="url(#frameGrad)" stroke="#383838" stroke-width="1.5"/>
    <!-- Vertical legs front -->
    <rect x="40" y="115" width="8" height="43" rx="4" fill="url(#frameGrad)" stroke="#383838" stroke-width="1.5"/>
    <rect x="144" y="115" width="8" height="43" rx="4" fill="url(#frameGrad)" stroke="#383838" stroke-width="1.5"/>
    <!-- Vertical legs rear (shorter — perspective) -->
    <rect x="50" y="120" width="7" height="35" rx="3.5" fill="#555555" stroke="#303030" stroke-width="1.5"/>
    <rect x="135" y="120" width="7" height="35" rx="3.5" fill="#555555" stroke="#303030" stroke-width="1.5"/>
    <!-- Horizontal side rails -->
    <path d="M48 118 L57 122 M144 118 L135 122" stroke="#5A5A5A" stroke-width="3" stroke-linecap="round"/>
    <!-- Lower shelf bar -->
    <rect x="50" y="133" width="92" height="4" rx="2" fill="#606060" stroke="#383838" stroke-width="1.5"/>

    <!-- ══════════════════════════════════
         CART BODY — flat rectangular top
    ══════════════════════════════════ -->
    <!-- Body sides (slight perspective) -->
    <path d="M40 108 L52 112 L52 118 L40 115 Z" fill="#4A4040" stroke="#2A2828" stroke-width="1.5"/>
    <path d="M152 108 L140 112 L140 118 L152 115 Z" fill="#4A4040" stroke="#2A2828" stroke-width="1.5"/>
    <!-- Front face of cart body -->
    <rect x="40" y="108" width="112" height="10" rx="2" fill="url(#lacquerGrad)" stroke="#2A1010" stroke-width="2"/>
    <!-- Red trim stripe on front face -->
    <rect x="40" y="111" width="112" height="4" fill="#C62828" opacity="0.7"/>

    <!-- ══════════════════════════════════
         TOP SURFACE — cream tablecloth
    ══════════════════════════════════ -->
    <!-- Tablecloth base (slight 3/4 perspective — top is narrower) -->
    <path d="M52 80 L140 80 L152 108 L40 108 Z" fill="url(#topGrad)" stroke="#C0B098" stroke-width="2"/>
    <!-- Red embroidered border on cloth -->
    <path d="M56 82 L136 82 L148 107 L44 107 Z" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- ══════════════════════════════════
         DISHES ON TOP — 5-6 dishes visible
    ══════════════════════════════════ -->
    <!-- Steamer basket (top-left area) — small stacked circles -->
    <ellipse cx="70" cy="98" rx="16" ry="12" fill="#C89050" stroke="#7A5020" stroke-width="2"/>
    <ellipse cx="70" cy="95" rx="16" ry="12" fill="#D4A060" stroke="#7A5020" stroke-width="2"/>
    <ellipse cx="70" cy="92" rx="16" ry="11" fill="#C89050" stroke="#7A5020" stroke-width="2"/>
    <ellipse cx="70" cy="91" rx="14" ry="7" fill="#4A2C0A"/>
    <!-- Gold rim on steamer -->
    <ellipse cx="70" cy="91" rx="16" ry="8" fill="none" stroke="#F0C040" stroke-width="1.5"/>

    <!-- Har gow plate (top center) — white plate with pink dumplings -->
    <ellipse cx="96" cy="88" rx="17" ry="12" fill="#FAFAFA" stroke="#C0C0C0" stroke-width="2"/>
    <ellipse cx="88" cy="90" rx="7"  ry="5"  fill="#F0A0A0" stroke="#C88080" stroke-width="1.5"/>
    <path d="M82 90 Q88 85 94 90" fill="none" stroke="#C08080" stroke-width="1.5"/>
    <ellipse cx="104" cy="89" rx="7" ry="5"  fill="#F0A0A0" stroke="#C88080" stroke-width="1.5"/>
    <path d="M98 89 Q104 84 110 89" fill="none" stroke="#C08080" stroke-width="1.5"/>

    <!-- Small bowl (top right) -->
    <ellipse cx="123" cy="91" rx="14" ry="10" fill="#EDE0C8" stroke="#B8A888" stroke-width="2"/>
    <ellipse cx="123" cy="89" rx="10" ry="6"  fill="#D4A060" opacity="0.5"/>
    <!-- Steam from bowl -->
    <path d="M120 82 Q118 76 120 71" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M126 82 Q124 76 126 71" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Second steamer (bottom-left) -->
    <ellipse cx="68" cy="105" rx="14" ry="9" fill="#C89050" stroke="#F0C040" stroke-width="1.5"/>

    <!-- Saucer with cup (bottom-right area) -->
    <ellipse cx="122" cy="103" rx="13" ry="8" fill="#E8E0D0" stroke="#C0B8A8" stroke-width="1.5"/>
    <ellipse cx="122" cy="101" rx="8"  ry="6" fill="#C62828" stroke="#8C1010" stroke-width="1.5"/>
    <ellipse cx="122" cy="99"  rx="6"  ry="3" fill="#D4501080" />

    <!-- ══════════════════════════════════
         HANDLE — T-bar at left end
    ══════════════════════════════════ -->
    <rect x="22" y="86" width="6" height="30" rx="3" fill="url(#frameGrad)" stroke="#383838" stroke-width="1.5"/>
    <!-- T crossbar -->
    <rect x="14" y="84" width="22" height="6" rx="3" fill="url(#frameGrad)" stroke="#383838" stroke-width="1.5"/>
    <!-- Handle grip rubber -->
    <rect x="15" y="84" width="20" height="6" rx="3" fill="#3A3A3A"/>

    <!-- ══════════════════════════════════
         RED CORNER TASSELS / ORNAMENTS
    ══════════════════════════════════ -->
    <!-- Front-left corner tassel -->
    <circle cx="44" cy="108" r="5" fill="#C62828" stroke="#8C1010" stroke-width="1.5"/>
    <line x1="44" y1="113" x2="42" y2="123" stroke="#C62828" stroke-width="2" stroke-linecap="round"/>
    <line x1="44" y1="113" x2="46" y2="123" stroke="#C62828" stroke-width="2" stroke-linecap="round"/>
    <circle cx="42" cy="124" r="3" fill="#C62828"/>
    <circle cx="46" cy="124" r="3" fill="#C62828"/>
    <!-- Front-right corner tassel -->
    <circle cx="148" cy="108" r="5" fill="#C62828" stroke="#8C1010" stroke-width="1.5"/>
    <line x1="148" y1="113" x2="146" y2="123" stroke="#C62828" stroke-width="2" stroke-linecap="round"/>
    <line x1="148" y1="113" x2="150" y2="123" stroke="#C62828" stroke-width="2" stroke-linecap="round"/>
    <circle cx="146" cy="124" r="3" fill="#C62828"/>
    <circle cx="150" cy="124" r="3" fill="#C62828"/>

  </g>
</svg>
