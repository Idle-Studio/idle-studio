<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A4A"/>
      <stop offset="100%" stop-color="#2E3A50"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8DCC0"/>
      <stop offset="100%" stop-color="#C4B890"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0E4C8"/>
      <stop offset="100%" stop-color="#D0C4A0"/>
    </linearGradient>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#D4A020"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7A5A"/>
      <stop offset="100%" stop-color="#5A4A30"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- Sky -->
    <rect x="14" y="14" width="164" height="120" rx="3" fill="url(#skyGrad)"/>

    <!-- Main building facade -->
    <rect x="22" y="62" width="148" height="98" rx="3" fill="url(#stoneGrad)" stroke="#9A8860" stroke-width="2.5"/>

    <!-- Facade top-left highlight -->
    <path d="M22 62 L170 62 L170 72 Q96 66 22 76 Z" fill="white" opacity="0.12"/>

    <!-- Roofline / pediment -->
    <path d="M22 62 L96 40 L170 62 Z" fill="url(#roofGrad)" stroke="#6A5A38" stroke-width="2.5"/>
    <path d="M22 62 L96 40 L170 62" fill="none" stroke="#8B7A5A" stroke-width="1.5"/>

    <!-- Pediment highlight -->
    <path d="M30 62 L96 43 L162 62 L96 48 Z" fill="white" opacity="0.08"/>

    <!-- Left pilaster -->
    <rect x="24" y="62" width="16" height="98" rx="2" fill="#D4C8A0" stroke="#9A8860" stroke-width="1.5"/>
    <rect x="22" y="60" width="20" height="7" rx="2" fill="#DDD0A8" stroke="#9A8860" stroke-width="1.5"/>
    <!-- Right pilaster -->
    <rect x="152" y="62" width="16" height="98" rx="2" fill="#D4C8A0" stroke="#9A8860" stroke-width="1.5"/>
    <rect x="150" y="60" width="20" height="7" rx="2" fill="#DDD0A8" stroke="#9A8860" stroke-width="1.5"/>

    <!-- Upper windows — row 1, left wing -->
    <rect x="34" y="72" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>
    <rect x="60" y="72" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>
    <!-- Upper windows — row 1, right wing -->
    <rect x="112" y="72" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>
    <rect x="138" y="72" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>

    <!-- Gold sign / plaque above door -->
    <rect x="74" y="72" width="44" height="12" rx="3" fill="#B8860B" stroke="#F0C040" stroke-width="1.5"/>
    <rect x="78" y="75" width="36" height="2.5" rx="1.25" fill="#F0C040" opacity="0.9"/>
    <rect x="82" y="79" width="28" height="2" rx="1" fill="#F0C040" opacity="0.7"/>

    <!-- Central arched door -->
    <rect x="80" y="92" width="32" height="48" rx="0" fill="#2A1808" stroke="#8A7850" stroke-width="2"/>
    <ellipse cx="96" cy="92" rx="16" ry="8" fill="#2A1808" stroke="#8A7850" stroke-width="2"/>
    <!-- Door panels -->
    <rect x="82" y="96" width="12" height="18" rx="1" fill="#3A2010" stroke="#6A4820" stroke-width="1"/>
    <rect x="98" y="96" width="12" height="18" rx="1" fill="#3A2010" stroke="#6A4820" stroke-width="1"/>
    <!-- Door handles (gold) -->
    <circle cx="91" cy="116" r="2" fill="#F0C040"/>
    <circle cx="101" cy="116" r="2" fill="#F0C040"/>

    <!-- Lower windows — row 2, left -->
    <rect x="34" y="94" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>
    <rect x="60" y="94" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>
    <!-- Lower windows — row 2, right -->
    <rect x="112" y="94" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>
    <rect x="138" y="94" width="20" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.8"/>

    <!-- Steps -->
    <rect x="72" y="140" width="48" height="7" rx="1" fill="url(#stepGrad)" stroke="#A09070" stroke-width="1.5"/>
    <rect x="66" y="147" width="60" height="7" rx="1" fill="url(#stepGrad)" stroke="#A09070" stroke-width="1.5"/>
    <rect x="58" y="154" width="76" height="8" rx="1" fill="url(#stepGrad)" stroke="#A09070" stroke-width="1.5"/>

    <!-- Ground base -->
    <rect x="22" y="160" width="148" height="4" rx="2" fill="#8B6914" opacity="0.45"/>

    <!-- Flagpole -->
    <rect x="94.5" y="18" width="3" height="24" rx="1" fill="#8B6914" stroke="#5A4208" stroke-width="1"/>
    <!-- Flag (gold with chef's hat) -->
    <path d="M97 19 L97 36 L124 31.5 L124 23.5 Z" fill="url(#flagGrad)" stroke="#8B6914" stroke-width="1.5"/>
    <!-- Chef's hat on flag (white toque) -->
    <!-- Hat brim -->
    <rect x="105" y="30" width="14" height="3.5" rx="1.75" fill="white" opacity="0.95"/>
    <!-- Hat cylinder -->
    <rect x="107" y="23" width="10" height="8" rx="2" fill="white" opacity="0.95"/>
    <!-- Hat puff top -->
    <ellipse cx="112" cy="23" rx="6" ry="4.5" fill="white" opacity="0.95"/>
    <!-- Hat puff detail -->
    <ellipse cx="112" cy="22" rx="4" ry="3" fill="white" opacity="0.85"/>

    <!-- Ivy/vines on corners -->
    <!-- Left ivy -->
    <path d="M24 78 Q18 82 22 88 Q16 90 20 96 Q15 100 19 106" fill="none" stroke="#2A4020" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="20" cy="84" rx="4" ry="3" fill="#2A4020" opacity="0.75" transform="rotate(-20, 20, 84)"/>
    <ellipse cx="18" cy="96" rx="4" ry="3" fill="#2A4020" opacity="0.75" transform="rotate(15, 18, 96)"/>
    <!-- Right ivy -->
    <path d="M168 78 Q174 82 170 88 Q176 90 172 96 Q177 100 173 106" fill="none" stroke="#2A4020" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="172" cy="84" rx="4" ry="3" fill="#2A4020" opacity="0.75" transform="rotate(20, 172, 84)"/>
    <ellipse cx="174" cy="96" rx="4" ry="3" fill="#2A4020" opacity="0.75" transform="rotate(-15, 174, 96)"/>

  </g>
</svg>
