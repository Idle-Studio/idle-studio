<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A4A"/>
      <stop offset="100%" stop-color="#2E4060"/>
    </linearGradient>
    <linearGradient id="fuselageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF5"/>
      <stop offset="100%" stop-color="#D8D0C0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8DDE0"/>
      <stop offset="100%" stop-color="#9AAAB0"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#8090A0"/>
    </linearGradient>
    <linearGradient id="clocheGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#9A9A9A"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- Sky gradient -->
    <rect x="14" y="14" width="164" height="164" rx="4" fill="url(#skyGrad)"/>

    <!-- Stars in sky -->
    <circle cx="30" cy="28" r="1.2" fill="white" opacity="0.7"/>
    <circle cx="52" cy="22" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="80" cy="20" r="1.1" fill="white" opacity="0.65"/>
    <circle cx="148" cy="24" r="1" fill="white" opacity="0.6"/>
    <circle cx="170" cy="30" r="1.3" fill="white" opacity="0.7"/>
    <circle cx="162" cy="18" r="0.9" fill="white" opacity="0.55"/>

    <!-- Speed lines (behind tail) -->
    <line x1="14" y1="82" x2="44" y2="84" stroke="white" stroke-width="1" opacity="0.18"/>
    <line x1="14" y1="88" x2="44" y2="89" stroke="white" stroke-width="1.5" opacity="0.22"/>
    <line x1="14" y1="94" x2="44" y2="94" stroke="white" stroke-width="1" opacity="0.18"/>
    <line x1="14" y1="100" x2="40" y2="100" stroke="white" stroke-width="0.8" opacity="0.14"/>

    <!-- Aircraft fuselage (wide-body, side view) -->
    <!-- Main fuselage oval -->
    <ellipse cx="110" cy="92" rx="74" ry="26" fill="url(#fuselageGrad)" stroke="#C0B8A8" stroke-width="2.5"/>
    <!-- Fuselage underside shadow -->
    <ellipse cx="110" cy="104" rx="68" ry="8" fill="#C0B0A0" opacity="0.35"/>

    <!-- Gold stripe along fuselage -->
    <path d="M38 86 Q110 80 182 86" fill="none" stroke="#B8860B" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 86 Q110 80 182 86" fill="none" stroke="#F0C040" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Cockpit nose windows -->
    <ellipse cx="40" cy="90" rx="8" ry="5" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="44" cy="88" rx="4" ry="3" fill="white" opacity="0.3"/>

    <!-- Fuselage windows row (8 oval windows) -->
    <ellipse cx="72" cy="88" rx="5.5" ry="4" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5"/>
    <ellipse cx="86" cy="86" rx="5.5" ry="4" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5"/>
    <ellipse cx="100" cy="85" rx="5.5" ry="4" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5"/>
    <!-- Featured center window (larger, highlighted) -->
    <ellipse cx="114" cy="85" rx="7" ry="5" fill="#C8E4F8" stroke="#F0C040" stroke-width="2"/>
    <!-- Chef's hat in featured window -->
    <rect cx="114" cy="87" x="108" y="87" width="12" height="3" rx="1.5" fill="white" opacity="0.95"/>
    <rect x="110" y="82" width="8" height="6" rx="1.5" fill="white" opacity="0.95"/>
    <ellipse cx="114" cy="82" rx="5" ry="3.5" fill="white" opacity="0.95"/>
    <!-- Food tray cloche in window -->
    <ellipse cx="114" cy="90.5" rx="6" ry="1.5" fill="url(#clocheGrad)" opacity="0.85"/>
    <ellipse cx="114" cy="89.5" rx="5.5" ry="2.5" fill="url(#clocheGrad)" opacity="0.8"/>

    <ellipse cx="130" cy="86" rx="5.5" ry="4" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5"/>
    <ellipse cx="144" cy="88" rx="5.5" ry="4" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5"/>
    <ellipse cx="158" cy="90" rx="5.5" ry="4" fill="#B0D0E8" stroke="#9AB8C8" stroke-width="1.5"/>

    <!-- Main swept wings (lower fuselage) -->
    <path d="M120 100 L172 130 L168 134 L110 106 Z" fill="url(#wingGrad)" stroke="#9AAAB0" stroke-width="2"/>
    <!-- Wing highlight -->
    <path d="M120 100 L168 128 L168 131 L120 102 Z" fill="white" opacity="0.12"/>

    <!-- Second wing (partial left side) -->
    <path d="M96 104 L50 126 L52 130 L100 108 Z" fill="url(#wingGrad)" stroke="#9AAAB0" stroke-width="1.5" opacity="0.8"/>

    <!-- Engine pod 1 (right wing) -->
    <ellipse cx="152" cy="126" rx="12" ry="5" fill="url(#engineGrad)" stroke="#8090A0" stroke-width="2"/>
    <ellipse cx="160" cy="126" rx="5" ry="4.5" fill="#8090A0" stroke="#6A7A80" stroke-width="1.5"/>
    <!-- Engine intake circle -->
    <circle cx="142" cy="126" r="4" fill="#3A4A50" stroke="#5A6A70" stroke-width="1.5"/>
    <circle cx="142" cy="126" r="2" fill="#1A2A30"/>

    <!-- Engine pod 2 (left wing, smaller) -->
    <ellipse cx="62" cy="124" rx="10" ry="4" fill="url(#engineGrad)" stroke="#8090A0" stroke-width="1.5" opacity="0.85"/>
    <circle cx="53" cy="124" r="3" fill="#3A4A50" stroke="#5A6A70" stroke-width="1" opacity="0.85"/>

    <!-- Vertical tail stabilizer -->
    <path d="M28 92 L28 68 L50 82 L50 92 Z" fill="url(#fuselageGrad)" stroke="#C0B8A8" stroke-width="2"/>
    <!-- Tail gold accent -->
    <path d="M28 82 L28 68 L44 79" fill="#B8860B" opacity="0.55"/>
    <path d="M28 68 L44 79" stroke="#F0C040" stroke-width="2" stroke-linecap="round"/>

    <!-- Horizontal tail fins -->
    <path d="M30 96 L18 104 L20 108 L36 100 Z" fill="url(#wingGrad)" stroke="#9AAAB0" stroke-width="1.5"/>
    <path d="M32 96 L44 108 L46 105 L38 96 Z" fill="url(#wingGrad)" stroke="#9AAAB0" stroke-width="1.5"/>

    <!-- Clouds -->
    <ellipse cx="160" cy="46" rx="16" ry="8" fill="white" opacity="0.75"/>
    <ellipse cx="172" cy="46" rx="10" ry="6" fill="white" opacity="0.7"/>
    <ellipse cx="150" cy="46" rx="9" ry="5.5" fill="white" opacity="0.65"/>

    <ellipse cx="30" cy="52" rx="12" ry="6" fill="white" opacity="0.55"/>
    <ellipse cx="40" cy="52" rx="8" ry="5" fill="white" opacity="0.5"/>

  </g>
</svg>
