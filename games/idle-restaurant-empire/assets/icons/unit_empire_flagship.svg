<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2A4A"/>
      <stop offset="100%" stop-color="#2A3A5A"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0D4B8"/>
      <stop offset="100%" stop-color="#C4B890"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8B88A"/>
      <stop offset="100%" stop-color="#9A8860"/>
    </linearGradient>
    <linearGradient id="carpetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A02020"/>
      <stop offset="100%" stop-color="#6A1010"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E3C42"/>
      <stop offset="100%" stop-color="#1A2428"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- Sky background -->
    <rect x="20" y="14" width="152" height="130" rx="4" fill="url(#skyGrad)"/>

    <!-- Stone facade -->
    <rect x="28" y="38" width="136" height="120" rx="3" fill="url(#stoneGrad)" stroke="#A09070" stroke-width="2"/>

    <!-- Facade highlight (top-left light) -->
    <path d="M28 38 L164 38 L164 46 Q96 42 28 52 Z" fill="white" opacity="0.10"/>

    <!-- Left pilaster -->
    <rect x="30" y="42" width="14" height="112" rx="2" fill="#C8B890" stroke="#9A8860" stroke-width="1.5"/>
    <!-- Left pilaster capital -->
    <rect x="27" y="40" width="20" height="8" rx="2" fill="#D4C8A0" stroke="#9A8860" stroke-width="1.5"/>
    <!-- Left pilaster base -->
    <rect x="27" y="148" width="20" height="8" rx="2" fill="#D4C8A0" stroke="#9A8860" stroke-width="1.5"/>

    <!-- Right pilaster -->
    <rect x="148" y="42" width="14" height="112" rx="2" fill="#C8B890" stroke="#9A8860" stroke-width="1.5"/>
    <!-- Right pilaster capital -->
    <rect x="145" y="40" width="20" height="8" rx="2" fill="#D4C8A0" stroke="#9A8860" stroke-width="1.5"/>
    <!-- Right pilaster base -->
    <rect x="145" y="148" width="20" height="8" rx="2" fill="#D4C8A0" stroke="#9A8860" stroke-width="1.5"/>

    <!-- Golden sign above arch -->
    <rect x="62" y="44" width="68" height="18" rx="3" fill="#B8860B" stroke="#F0C040" stroke-width="2"/>
    <!-- Sign text lines -->
    <rect x="70" y="49" width="52" height="3" rx="1.5" fill="#F0C040" opacity="0.9"/>
    <rect x="76" y="55" width="40" height="2.5" rx="1.25" fill="#F0C040" opacity="0.7"/>

    <!-- Grand archway — arch body -->
    <rect x="68" y="66" width="56" height="90" rx="0" fill="url(#archGrad)" stroke="#8A7850" stroke-width="2"/>
    <!-- Arch rounded top -->
    <ellipse cx="96" cy="66" rx="28" ry="14" fill="url(#archGrad)" stroke="#8A7850" stroke-width="2"/>
    <!-- Dark interior -->
    <rect x="74" y="72" width="44" height="84" fill="#1A0A08"/>
    <ellipse cx="96" cy="72" rx="22" ry="10" fill="#1A0A08"/>

    <!-- Interior warm glow -->
    <ellipse cx="96" cy="130" rx="18" ry="14" fill="#6A3010" opacity="0.5"/>
    <ellipse cx="96" cy="130" rx="10" ry="8" fill="#8A4820" opacity="0.4"/>

    <!-- Canopy awning -->
    <path d="M62 66 L130 66 L130 78 L62 78 Z" fill="url(#canopyGrad)"/>
    <path d="M62 78 Q68 88 74 78 Q80 88 86 78 Q92 88 98 78 Q104 88 110 78 Q116 88 122 78 Q128 88 134 78" fill="#1E2C32" stroke="#F0C040" stroke-width="1.5"/>
    <!-- Canopy gold edge -->
    <line x1="62" y1="66" x2="130" y2="66" stroke="#F0C040" stroke-width="2"/>

    <!-- Velvet rope posts -->
    <rect x="55" y="130" width="5" height="26" rx="2" fill="#D4A020" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="57" cy="130" r="3.5" fill="#F0C040" stroke="#B8860B" stroke-width="1"/>
    <rect x="132" y="130" width="5" height="26" rx="2" fill="#D4A020" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="134" cy="130" r="3.5" fill="#F0C040" stroke="#B8860B" stroke-width="1"/>
    <!-- Velvet rope curve -->
    <path d="M57 133 Q96 145 134 133" fill="none" stroke="#8B1A1A" stroke-width="3" stroke-linecap="round"/>
    <path d="M57 133 Q96 145 134 133" fill="none" stroke="#C02020" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Red carpet -->
    <path d="M74 156 L118 156 L122 170 L70 170 Z" fill="url(#carpetGrad)"/>
    <!-- Carpet gold trim -->
    <line x1="74" y1="156" x2="70" y2="170" stroke="#F0C040" stroke-width="1.5"/>
    <line x1="118" y1="156" x2="122" y2="170" stroke="#F0C040" stroke-width="1.5"/>
    <line x1="70" y1="170" x2="122" y2="170" stroke="#F0C040" stroke-width="1.5"/>

    <!-- Ground line -->
    <rect x="28" y="155" width="136" height="3" rx="1.5" fill="#8B6914" opacity="0.5"/>

    <!-- Exterior wall sconces -->
    <!-- Left sconce -->
    <rect x="44" y="95" width="6" height="10" rx="1" fill="#D4A020" stroke="#B8860B" stroke-width="1.5"/>
    <ellipse cx="47" cy="93" rx="5" ry="4" fill="#FFE080" opacity="0.85" stroke="#D4A020" stroke-width="1"/>
    <circle cx="47" cy="93" r="2.5" fill="#FFF0A0" opacity="0.9"/>

    <!-- Right sconce -->
    <rect x="142" y="95" width="6" height="10" rx="1" fill="#D4A020" stroke="#B8860B" stroke-width="1.5"/>
    <ellipse cx="145" cy="93" rx="5" ry="4" fill="#FFE080" opacity="0.85" stroke="#D4A020" stroke-width="1"/>
    <circle cx="145" cy="93" r="2.5" fill="#FFF0A0" opacity="0.9"/>

    <!-- Upper facade windows (flanking sign) -->
    <rect x="34" y="46" width="22" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.7"/>
    <rect x="136" y="46" width="22" height="14" rx="2" fill="#B0D0E8" stroke="#8A7850" stroke-width="1.5" opacity="0.7"/>

  </g>
</svg>
