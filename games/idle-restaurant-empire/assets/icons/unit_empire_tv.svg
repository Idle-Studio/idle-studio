<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="studioGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2A"/>
      <stop offset="100%" stop-color="#2A2A3A"/>
    </linearGradient>
    <linearGradient id="cameraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8E0F0"/>
      <stop offset="100%" stop-color="#3A6A90"/>
    </linearGradient>
    <linearGradient id="cookingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5EDD8"/>
      <stop offset="100%" stop-color="#D8C8A0"/>
    </linearGradient>
    <linearGradient id="panGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A4A3A"/>
      <stop offset="100%" stop-color="#2A1A0A"/>
    </linearGradient>
    <linearGradient id="lightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE080"/>
      <stop offset="100%" stop-color="#D4A020"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD060" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- Studio dark background -->
    <rect x="14" y="14" width="164" height="164" rx="5" fill="url(#studioGrad)"/>

    <!-- Studio lighting warm glow from above/right -->
    <ellipse cx="140" cy="80" rx="55" ry="40" fill="#7A5020" opacity="0.22"/>

    <!-- Studio overhead light rigs (top) -->
    <!-- Light 1 -->
    <rect x="32" y="18" width="38" height="10" rx="2" fill="#3A3A3A" stroke="#505050" stroke-width="1.5"/>
    <rect x="36" y="26" width="30" height="8" rx="1" fill="url(#lightGrad)" stroke="#D4A020" stroke-width="1"/>
    <!-- Warm glow from light 1 -->
    <ellipse cx="51" cy="50" rx="22" ry="16" fill="url(#glowGrad)"/>
    <!-- Light 2 -->
    <rect x="118" y="18" width="42" height="10" rx="2" fill="#3A3A3A" stroke="#505050" stroke-width="1.5"/>
    <rect x="122" y="26" width="34" height="8" rx="1" fill="url(#lightGrad)" stroke="#D4A020" stroke-width="1"/>
    <!-- Warm glow from light 2 -->
    <ellipse cx="139" cy="52" rx="24" ry="16" fill="url(#glowGrad)"/>
    <!-- Light mounting wires -->
    <line x1="51" y1="14" x2="51" y2="18" stroke="#505050" stroke-width="1.5"/>
    <line x1="139" y1="14" x2="139" y2="18" stroke="#505050" stroke-width="1.5"/>

    <!-- Cooking station backdrop -->
    <rect x="92" y="52" width="78" height="100" rx="4" fill="#2A1E14" stroke="#4A3820" stroke-width="1.5"/>
    <!-- Countertop -->
    <rect x="96" y="118" width="70" height="16" rx="3" fill="url(#cookingGrad)" stroke="#A09070" stroke-width="2"/>
    <rect x="96" y="118" width="70" height="5" rx="2" fill="white" opacity="0.15"/>

    <!-- Pan on cooking station -->
    <ellipse cx="131" cy="110" rx="18" ry="10" fill="url(#panGrad)" stroke="#4A3020" stroke-width="2"/>
    <!-- Pan handle -->
    <rect x="148" y="108" width="16" height="4" rx="2" fill="#3A2810" stroke="#2A1808" stroke-width="1.5"/>
    <!-- Food in pan (golden/sizzling) -->
    <ellipse cx="131" cy="108" rx="12" ry="6" fill="#D4A020" opacity="0.85"/>
    <ellipse cx="128" cy="107" rx="4" ry="3" fill="#F0C040" opacity="0.8"/>
    <ellipse cx="135" cy="109" rx="3.5" ry="2.5" fill="#F0C040" opacity="0.75"/>
    <!-- Steam puffs -->
    <path d="M122 102 Q120 96 122 90" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M131 100 Q129 94 131 88" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M140 102 Q138 96 140 90" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Cooking station back wall light strip -->
    <rect x="96" y="54" width="70" height="6" rx="2" fill="#FFD060" opacity="0.4"/>

    <!-- Camera body -->
    <rect x="22" y="80" width="72" height="50" rx="5" fill="url(#cameraGrad)" stroke="#484848" stroke-width="3"/>
    <!-- Camera body top-left highlight -->
    <path d="M22 80 L94 80 L94 90 Q58 84 22 92 Z" fill="white" opacity="0.08"/>

    <!-- Lens hood extending forward -->
    <rect x="14" y="90" width="12" height="30" rx="2" fill="#252525" stroke="#383838" stroke-width="2"/>
    <!-- Lens barrel -->
    <circle cx="26" cy="105" r="18" fill="#1A1A1A" stroke="#484848" stroke-width="2.5"/>
    <!-- Lens elements (concentric) -->
    <circle cx="26" cy="105" r="15" fill="url(#lensGrad)"/>
    <circle cx="26" cy="105" r="11" fill="#2A4A6A" stroke="#3A6090" stroke-width="1"/>
    <circle cx="26" cy="105" r="7" fill="#1A2A3A" stroke="#2A4060" stroke-width="1"/>
    <circle cx="26" cy="105" r="3.5" fill="#080E14"/>
    <!-- Lens glint -->
    <circle cx="20" cy="99" r="2" fill="white" opacity="0.55"/>
    <circle cx="19" cy="100" r="1" fill="white" opacity="0.8"/>

    <!-- Red recording light -->
    <circle cx="88" cy="84" r="4.5" fill="#FF0000" stroke="#CC0000" stroke-width="1.5"/>
    <circle cx="88" cy="84" r="2.5" fill="#FF4040" opacity="0.9"/>
    <!-- ON AIR glow -->
    <circle cx="88" cy="84" r="7" fill="#FF0000" opacity="0.20"/>

    <!-- Viewfinder (back of camera) -->
    <rect x="82" y="88" width="14" height="10" rx="2" fill="#101010" stroke="#383838" stroke-width="1.5"/>
    <rect x="84" y="90" width="10" height="7" rx="1" fill="#1A3A20" opacity="0.9"/>

    <!-- Camera top controls/buttons -->
    <rect x="30" y="78" width="30" height="5" rx="2" fill="#383838" stroke="#484848" stroke-width="1"/>
    <circle cx="36" cy="80.5" r="1.8" fill="#505050"/>
    <circle cx="44" cy="80.5" r="1.8" fill="#505050"/>
    <circle cx="52" cy="80.5" r="2.5" fill="#D4A020" stroke="#B8860B" stroke-width="1"/>

    <!-- Camera dolly platform -->
    <rect x="22" y="130" width="72" height="10" rx="3" fill="#2E2E2E" stroke="#3A3A3A" stroke-width="2"/>
    <!-- Dolly track bar -->
    <rect x="18" y="138" width="80" height="5" rx="2.5" fill="#252525" stroke="#383838" stroke-width="1.5"/>
    <!-- Wheels (4 small) -->
    <circle cx="30" cy="146" r="6" fill="#1A1A1A" stroke="#383838" stroke-width="2"/>
    <circle cx="30" cy="146" r="3" fill="#303030"/>
    <circle cx="30" cy="146" r="1.5" fill="#505050"/>
    <circle cx="56" cy="146" r="6" fill="#1A1A1A" stroke="#383838" stroke-width="2"/>
    <circle cx="56" cy="146" r="3" fill="#303030"/>
    <circle cx="56" cy="146" r="1.5" fill="#505050"/>
    <circle cx="82" cy="146" r="6" fill="#1A1A1A" stroke="#383838" stroke-width="2"/>
    <circle cx="82" cy="146" r="3" fill="#303030"/>
    <circle cx="82" cy="146" r="1.5" fill="#505050"/>

    <!-- Gold trim accent on camera body -->
    <rect x="22" y="126" width="72" height="4" rx="2" fill="#B8860B" opacity="0.8"/>

  </g>
</svg>
