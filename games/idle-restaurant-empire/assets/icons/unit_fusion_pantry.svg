<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <!-- Globe base gradient (deep blue-purple) -->
    <radialGradient id="globeGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2A1880"/>
      <stop offset="60%" stop-color="#1A1050"/>
      <stop offset="100%" stop-color="#0A0830"/>
    </radialGradient>
    <!-- Globe atmosphere rim -->
    <radialGradient id="globeRim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#6A1B9A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8E24AA" stop-opacity="0.40"/>
    </radialGradient>
    <!-- Continent land -->
    <linearGradient id="landGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E24AA"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <!-- Orbit dashes / connection lines color: #CE93D8 -->
    <!-- Ingredient cloud puff -->
    <radialGradient id="cloudGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEE8FF" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#EEE8FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Star sparkle color: white -->
  </defs>

  <g filter="url(#ds)">

    <!-- ── BACKGROUND SPARKLE STARS ── -->
    <circle cx="30"  cy="38"  r="1.5" fill="white" opacity="0.55"/>
    <circle cx="162" cy="48"  r="1"   fill="white" opacity="0.45"/>
    <circle cx="148" cy="160" r="1.5" fill="white" opacity="0.50"/>
    <circle cx="22"  cy="148" r="1"   fill="white" opacity="0.40"/>
    <circle cx="172" cy="98"  r="1.5" fill="white" opacity="0.55"/>
    <circle cx="52"  cy="170" r="1"   fill="white" opacity="0.40"/>
    <circle cx="88"  cy="24"  r="1.5" fill="white" opacity="0.45"/>

    <!-- ── GLOBE ── -->
    <circle cx="96" cy="100" r="54" fill="url(#globeGrad)" stroke="#4A148C" stroke-width="2.5"/>
    <!-- Atmosphere rim glow -->
    <circle cx="96" cy="100" r="54" fill="url(#globeRim)"/>

    <!-- Grid lines — latitude -->
    <ellipse cx="96" cy="100" rx="54" ry="18" fill="none" stroke="#3A2870" stroke-width="1" opacity="0.60"/>
    <ellipse cx="96" cy="82"  rx="48" ry="10" fill="none" stroke="#3A2870" stroke-width="1" opacity="0.45"/>
    <ellipse cx="96" cy="118" rx="48" ry="10" fill="none" stroke="#3A2870" stroke-width="1" opacity="0.45"/>
    <!-- Grid lines — longitude -->
    <path d="M96 46 Q120 100 96 154" fill="none" stroke="#3A2870" stroke-width="1" opacity="0.55"/>
    <path d="M96 46 Q72 100 96 154"  fill="none" stroke="#3A2870" stroke-width="1" opacity="0.55"/>
    <line x1="42" y1="100" x2="150" y2="100" stroke="#3A2870" stroke-width="1" opacity="0.50"/>

    <!-- Continent shapes (simplified) -->
    <!-- Continent 1 — large left mass (Americas-ish) -->
    <path d="M66 80 Q72 72 80 76 Q86 80 84 90 Q82 100 76 104 Q70 108 66 100 Q62 92 66 80 Z"
          fill="url(#landGrad)" opacity="0.80"/>
    <!-- Continent 2 — right mass (Eurasia-ish) -->
    <path d="M100 76 Q110 70 118 74 Q128 78 126 88 Q124 98 116 102 Q108 106 100 100 Q96 92 100 76 Z"
          fill="url(#landGrad)" opacity="0.80"/>
    <!-- Continent 3 — small bottom (Africa-ish) -->
    <path d="M94 112 Q100 108 106 112 Q110 120 106 128 Q100 132 96 128 Q92 120 94 112 Z"
          fill="url(#landGrad)" opacity="0.70"/>
    <!-- Continent highlight streaks -->
    <path d="M68 82 Q74 76 78 80" fill="none" stroke="#CE93D8" stroke-width="1" opacity="0.40"/>
    <path d="M102 78 Q108 72 114 76" fill="none" stroke="#CE93D8" stroke-width="1" opacity="0.40"/>

    <!-- Globe highlight (top-left) -->
    <path d="M60 62 Q72 52 86 58 Q76 70 62 72 Z" fill="white" opacity="0.10"/>

    <!-- Globe equatorial glint -->
    <path d="M50 100 Q60 96 70 100" fill="none" stroke="white" stroke-width="1.5" opacity="0.18"/>

    <!-- ══════════════════════════════════
         ORBITING INGREDIENTS (5 around globe)
         Positions: top (12 o'clock), top-right, bottom-right, bottom-left, top-left
    ══════════════════════════════════ -->

    <!-- Connection dashed lines from globe to each ingredient -->
    <!-- Top: chili -->
    <line x1="96" y1="46" x2="96" y2="28" stroke="#CE93D8" stroke-width="1" stroke-dasharray="3,3" opacity="0.60"/>
    <!-- Top-right: lemon -->
    <line x1="138" y1="62" x2="156" y2="46" stroke="#CE93D8" stroke-width="1" stroke-dasharray="3,3" opacity="0.60"/>
    <!-- Right: star anise -->
    <line x1="150" y1="100" x2="168" y2="100" stroke="#CE93D8" stroke-width="1" stroke-dasharray="3,3" opacity="0.60"/>
    <!-- Bottom-right: herb leaf -->
    <line x1="138" y1="138" x2="152" y2="158" stroke="#CE93D8" stroke-width="1" stroke-dasharray="3,3" opacity="0.60"/>
    <!-- Left: fish -->
    <line x1="42" y1="100" x2="24" y2="100" stroke="#CE93D8" stroke-width="1" stroke-dasharray="3,3" opacity="0.60"/>

    <!-- INGREDIENT 1 — CHILI PEPPER (top) -->
    <!-- Cloud puff -->
    <ellipse cx="96" cy="22" rx="14" ry="10" fill="url(#cloudGrad)"/>
    <!-- Chili body -->
    <path d="M90 26 Q96 16 102 26 Q100 30 96 28 Q92 30 90 26 Z" fill="#C62828"/>
    <path d="M90 26 Q96 16 102 26" fill="none" stroke="#8B0000" stroke-width="1.5"/>
    <!-- Chili stem -->
    <path d="M96 16 Q98 12 96 10" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
    <circle cx="96" cy="24" r="1.5" fill="white" opacity="0.45"/>

    <!-- INGREDIENT 2 — LEMON (top-right) -->
    <ellipse cx="162" cy="40" rx="14" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="162" cy="40" rx="9" ry="7" fill="#F0C040" stroke="#C09010" stroke-width="1.5"/>
    <!-- Lemon bump -->
    <circle cx="169" cy="40" r="2" fill="#F0C040" stroke="#C09010" stroke-width="1"/>
    <!-- Lemon highlight -->
    <ellipse cx="158" cy="37" rx="3" ry="2" fill="white" opacity="0.35"/>

    <!-- INGREDIENT 3 — STAR ANISE (right) -->
    <ellipse cx="174" cy="100" rx="12" ry="12" fill="url(#cloudGrad)"/>
    <!-- Star shape (8-pointed) -->
    <path d="M174 88 L176 95 L183 93 L178 99 L183 105 L176 103 L174 110 L172 103 L165 105 L170 99 L165 93 L172 95 Z"
          fill="#8B5E3C" stroke="#5A3A18" stroke-width="1"/>
    <!-- Center circle -->
    <circle cx="174" cy="99" r="3" fill="#6A4020" stroke="#3A1808" stroke-width="1"/>

    <!-- INGREDIENT 4 — HERB LEAF (bottom-right) -->
    <ellipse cx="156" cy="162" rx="14" ry="10" fill="url(#cloudGrad)"/>
    <!-- Leaf -->
    <path d="M150 162 Q156 154 162 158 Q166 164 160 168 Q154 170 150 162 Z"
          fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
    <!-- Leaf vein -->
    <path d="M152 162 Q156 158 160 162" fill="none" stroke="#1B5E20" stroke-width="1" opacity="0.60"/>
    <line x1="156" y1="156" x2="156" y2="166" stroke="#1B5E20" stroke-width="1" opacity="0.50"/>

    <!-- INGREDIENT 5 — FISH (left) -->
    <ellipse cx="18" cy="100" rx="14" ry="10" fill="url(#cloudGrad)"/>
    <!-- Fish body -->
    <ellipse cx="17" cy="100" rx="9" ry="5" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
    <!-- Fish tail -->
    <path d="M8 100 L4 95 L4 105 Z" fill="#1565C0" stroke="#0D47A1" stroke-width="1"/>
    <!-- Fish scales -->
    <path d="M16 97 Q20 100 16 103" fill="none" stroke="#1E88E5" stroke-width="1" opacity="0.55"/>
    <!-- Fish eye -->
    <circle cx="23" cy="99" r="2" fill="white"/>
    <circle cx="23" cy="99" r="1" fill="#0A2060"/>

    <!-- ── Globe stand base (thin) ── -->
    <rect x="88" y="154" width="16" height="4" rx="2" fill="#4A148C" stroke="#2D0860" stroke-width="1.5"/>
    <rect x="82" y="157" width="28" height="5" rx="2" fill="#3A0E6A" stroke="#2D0860" stroke-width="1.5"/>

  </g>
</svg>
