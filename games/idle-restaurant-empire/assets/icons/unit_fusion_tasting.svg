<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <!-- Book cover leather -->
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A1A90"/>
      <stop offset="100%" stop-color="#2D0860"/>
    </linearGradient>
    <!-- Left page -->
    <linearGradient id="pageLeftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="100%" stop-color="#EDE8D8"/>
    </linearGradient>
    <!-- Right page -->
    <linearGradient id="pageRightGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#EAE5D5"/>
    </linearGradient>
    <!-- Spine shadow -->
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A0840" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3A1870" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1A0840" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Gold ribbon -->
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D040"/>
      <stop offset="100%" stop-color="#C09010"/>
    </linearGradient>
    <!-- Purple ambient base glow -->
    <radialGradient id="baseGlow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#6A1B9A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6A1B9A" stop-opacity="0"/>
    </radialGradient>
    <!-- Tent-fold table card -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="100%" stop-color="#E8E0CC"/>
    </linearGradient>
  </defs>

  <!-- Purple ambient glow at base -->
  <ellipse cx="96" cy="165" rx="70" ry="22" fill="url(#baseGlow)"/>

  <g filter="url(#ds)">

    <!-- ── TABLE CARD (behind book, slightly visible) ── -->
    <path d="M108 148 L120 130 L132 130 L132 155 L108 155 Z" fill="url(#cardGrad)" stroke="#C8B898" stroke-width="1.5"/>
    <path d="M108 148 L96 130 L120 130" fill="url(#cardGrad)" stroke="#C8B898" stroke-width="1.5"/>
    <!-- Table number text stub -->
    <line x1="112" y1="140" x2="126" y2="140" stroke="#8870A0" stroke-width="1" opacity="0.50"/>
    <line x1="114" y1="144" x2="124" y2="144" stroke="#8870A0" stroke-width="1" opacity="0.40"/>

    <!-- ══════════════════
         OPEN BOOKLET
    ══════════════════ -->

    <!-- Cover left edge (leather binding visible) -->
    <path d="M26 52 Q24 56 24 60 L24 158 Q24 162 28 163 L50 163 L50 52 Z"
          fill="url(#coverGrad)" stroke="#1E0840" stroke-width="1.5"/>
    <!-- Cover right edge -->
    <path d="M142 52 L142 163 L166 163 Q170 162 170 158 L170 60 Q170 56 168 52 Z"
          fill="url(#coverGrad)" stroke="#1E0840" stroke-width="1.5"/>

    <!-- Gold embossed corner details — top left cover -->
    <path d="M27 55 L34 55 L34 58 L27 58 Z" fill="#F0D040" opacity="0.70"/>
    <path d="M27 55 L27 62 L30 62 L30 55 Z" fill="#F0D040" opacity="0.70"/>
    <!-- Gold corner — bottom left cover -->
    <path d="M27 155 L34 155 L34 158 L27 158 Z" fill="#F0D040" opacity="0.70"/>
    <path d="M27 155 L27 162 L30 162 L30 155 Z" fill="#F0D040" opacity="0.70"/>
    <!-- Gold corner — top right cover -->
    <path d="M158 55 L165 55 L165 62 L162 62 L162 55 Z" fill="#F0D040" opacity="0.70"/>
    <path d="M162 55 L165 55 L165 58 L158 58 Z" fill="#F0D040" opacity="0.70"/>
    <!-- Gold corner — bottom right cover -->
    <path d="M162 155 L165 155 L165 162 L158 162 Z" fill="#F0D040" opacity="0.70"/>
    <path d="M158 158 L165 158 L165 162 L162 162 Z" fill="#F0D040" opacity="0.70"/>

    <!-- LEFT PAGE -->
    <path d="M50 52 L94 52 L94 163 L50 163 Z" fill="url(#pageLeftGrad)"/>
    <!-- Page top shadow (gentle fold) -->
    <path d="M50 52 L94 52 L94 56 Q72 58 50 56 Z" fill="#D0C8A8" opacity="0.30"/>

    <!-- RIGHT PAGE -->
    <path d="M98 52 L142 52 L142 163 L98 163 Z" fill="url(#pageRightGrad)"/>
    <path d="M98 52 L142 52 L142 56 Q120 58 98 56 Z" fill="#D0C8A8" opacity="0.25"/>

    <!-- SPINE / FOLD (center) -->
    <rect x="92" y="52" width="8" height="111" fill="url(#spineGrad)"/>
    <!-- Spine center fold line -->
    <line x1="96" y1="52" x2="96" y2="163" stroke="#1A0840" stroke-width="1" opacity="0.40"/>

    <!-- ══════════
         LEFT PAGE — 9 course lines
    ══════════ -->
    <!-- Page header -->
    <line x1="56" y1="62" x2="88" y2="62" stroke="#F0D040" stroke-width="1.5" opacity="0.70"/>
    <line x1="60" y1="65" x2="84" y2="65" stroke="#2A1A2A" stroke-width="0.8" opacity="0.50"/>

    <!-- Course 1 -->
    <line x1="54" y1="75" x2="56" y2="75" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="75" x2="88" y2="75" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="77" x2="82" y2="77" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 2 -->
    <line x1="54" y1="86" x2="56" y2="86" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="86" x2="88" y2="86" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="88" x2="78" y2="88" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 3 -->
    <line x1="54" y1="97" x2="56" y2="97" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="97" x2="88" y2="97" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="99" x2="85" y2="99" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 4 -->
    <line x1="54" y1="108" x2="56" y2="108" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="108" x2="88" y2="108" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="110" x2="80" y2="110" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 5 -->
    <line x1="54" y1="119" x2="56" y2="119" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="119" x2="88" y2="119" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="121" x2="84" y2="121" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 6 -->
    <line x1="54" y1="130" x2="56" y2="130" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="130" x2="88" y2="130" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="132" x2="76" y2="132" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 7 -->
    <line x1="54" y1="141" x2="56" y2="141" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="141" x2="88" y2="141" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="59" y1="143" x2="83" y2="143" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 8 -->
    <line x1="54" y1="150" x2="56" y2="150" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="150" x2="88" y2="150" stroke="#2A1A2A" stroke-width="1" opacity="0.45"/>
    <!-- Course 9 -->
    <line x1="54" y1="158" x2="56" y2="158" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="59" y1="158" x2="88" y2="158" stroke="#2A1A2A" stroke-width="1" opacity="0.45"/>

    <!-- ══════════
         RIGHT PAGE — 9 course lines
    ══════════ -->
    <!-- Page header -->
    <line x1="104" y1="62" x2="136" y2="62" stroke="#F0D040" stroke-width="1.5" opacity="0.70"/>
    <line x1="108" y1="65" x2="132" y2="65" stroke="#2A1A2A" stroke-width="0.8" opacity="0.50"/>

    <!-- Course 10 -->
    <line x1="102" y1="75" x2="104" y2="75" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="75" x2="136" y2="75" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="77" x2="130" y2="77" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 11 -->
    <line x1="102" y1="86" x2="104" y2="86" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="86" x2="136" y2="86" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="88" x2="128" y2="88" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 12 -->
    <line x1="102" y1="97" x2="104" y2="97" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="97" x2="136" y2="97" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="99" x2="133" y2="99" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 13 -->
    <line x1="102" y1="108" x2="104" y2="108" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="108" x2="136" y2="108" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="110" x2="127" y2="110" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 14 -->
    <line x1="102" y1="119" x2="104" y2="119" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="119" x2="136" y2="119" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="121" x2="131" y2="121" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 15 -->
    <line x1="102" y1="130" x2="104" y2="130" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="130" x2="136" y2="130" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="132" x2="124" y2="132" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 16 -->
    <line x1="102" y1="141" x2="104" y2="141" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="141" x2="136" y2="141" stroke="#2A1A2A" stroke-width="1" opacity="0.55"/>
    <line x1="107" y1="143" x2="129" y2="143" stroke="#C0A860" stroke-width="0.8" opacity="0.35"/>
    <!-- Course 17 -->
    <line x1="102" y1="150" x2="104" y2="150" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="150" x2="136" y2="150" stroke="#2A1A2A" stroke-width="1" opacity="0.45"/>
    <!-- Course 18 -->
    <line x1="102" y1="158" x2="104" y2="158" stroke="#8870A0" stroke-width="1.5"/>
    <line x1="107" y1="158" x2="136" y2="158" stroke="#2A1A2A" stroke-width="1" opacity="0.45"/>

    <!-- ── GOLD RIBBON BOOKMARK ── -->
    <rect x="118" y="155" width="5" height="28" rx="1" fill="url(#ribbonGrad)" stroke="#A08010" stroke-width="1"/>
    <!-- Ribbon pointed end -->
    <path d="M118 183 L120 178 L123 183 Z" fill="url(#ribbonGrad)" stroke="#A08010" stroke-width="1"/>
    <!-- Ribbon top fold -->
    <rect x="118" y="155" width="5" height="4" rx="1" fill="#F0E040" opacity="0.70"/>

    <!-- ── PAGE SHADOWS (subtle) ── -->
    <!-- Left page right edge shadow -->
    <path d="M91 52 L94 52 L94 163 L91 163 Z" fill="#2A1A40" opacity="0.10"/>
    <!-- Right page left edge shadow -->
    <path d="M98 52 L101 52 L101 163 L98 163 Z" fill="#2A1A40" opacity="0.10"/>

    <!-- Cover outline -->
    <path d="M26 52 L50 52 L50 163 L26 163" fill="none" stroke="#1E0840" stroke-width="2"/>
    <path d="M142 52 L166 52 L166 163 L142 163" fill="none" stroke="#1E0840" stroke-width="2"/>
    <!-- Page outlines -->
    <rect x="50" y="52" width="44" height="111" fill="none" stroke="#C0B080" stroke-width="1.5"/>
    <rect x="98" y="52" width="44" height="111" fill="none" stroke="#C0B080" stroke-width="1.5"/>

    <!-- Top cover strip (binding) -->
    <rect x="26" y="50" width="140" height="6" rx="2" fill="#4A148C" stroke="#1E0840" stroke-width="1.5"/>
    <!-- Bottom cover strip -->
    <rect x="26" y="162" width="140" height="5" rx="2" fill="#4A148C" stroke="#1E0840" stroke-width="1.5"/>

  </g>
</svg>
