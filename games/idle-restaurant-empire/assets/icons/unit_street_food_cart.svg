<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <clipPath id="ac">
      <rect x="34" y="50" width="124" height="32" rx="5"/>
    </clipPath>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2A070"/>
      <stop offset="100%" stop-color="#C05020"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── AWNING ── -->
    <rect x="34" y="50" width="124" height="32" rx="5" fill="#D4622A"/>
    <g clip-path="url(#ac)">
      <rect x="43"  y="50" width="15" height="32" fill="#F5A878" opacity="0.55"/>
      <rect x="72"  y="50" width="15" height="32" fill="#F5A878" opacity="0.55"/>
      <rect x="101" y="50" width="15" height="32" fill="#F5A878" opacity="0.55"/>
      <rect x="130" y="50" width="15" height="32" fill="#F5A878" opacity="0.55"/>
    </g>
    <rect x="34" y="50" width="124" height="32" rx="5" fill="none" stroke="#7A3012" stroke-width="2.5"/>
    <!-- Scalloped fringe -->
    <path d="M34 82 Q41 94 48 82 Q55 94 62 82 Q69 94 76 82 Q83 94 90 82 Q97 94 104 82 Q111 94 118 82 Q125 94 132 82 Q139 94 146 82 Q153 94 158 82"
          fill="#C05020" stroke="#7A3012" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- ── CART BODY ── -->
    <rect x="46" y="82" width="100" height="52" rx="6" fill="url(#bodyGrad)"/>
    <!-- Top-left highlight -->
    <path d="M52 82 Q46 82 46 88 L46 96 Q62 85 146 84 L146 82 Q140 82 52 82 Z" fill="white" opacity="0.10"/>
    <rect x="46" y="82" width="100" height="52" rx="6" fill="none" stroke="#7A3012" stroke-width="3"/>

    <!-- Service window -->
    <rect x="62" y="91" width="68" height="35" rx="4" fill="#FFF3E0"/>
    <rect x="62" y="91" width="68" height="35" rx="4" fill="none" stroke="#A8421A" stroke-width="2"/>
    <!-- Food items in window -->
    <ellipse cx="81" cy="109" rx="10" ry="7" fill="#F0C040"/>
    <ellipse cx="81" cy="109" rx="10" ry="7" fill="none" stroke="#C09820" stroke-width="1.5"/>
    <ellipse cx="111" cy="109" rx="10" ry="7" fill="#D4622A"/>
    <ellipse cx="111" cy="109" rx="10" ry="7" fill="none" stroke="#9A3810" stroke-width="1.5"/>
    <!-- Window sill -->
    <rect x="58" y="124" width="76" height="5" rx="2.5" fill="#A8421A"/>

    <!-- ── AXLE ── -->
    <rect x="53" y="132" width="86" height="9" rx="4" fill="#A8421A" stroke="#7A3012" stroke-width="2"/>

    <!-- ── LEFT WHEEL ── -->
    <circle cx="69" cy="150" r="15" fill="#3A2010" stroke="#1A0A00" stroke-width="2.5"/>
    <circle cx="69" cy="150" r="9"  fill="#6A4020"/>
    <circle cx="69" cy="150" r="4"  fill="#2A1008"/>
    <line x1="69" y1="136" x2="69" y2="164" stroke="#8A5828" stroke-width="2"/>
    <line x1="55" y1="150" x2="83" y2="150" stroke="#8A5828" stroke-width="2"/>

    <!-- ── RIGHT WHEEL ── -->
    <circle cx="123" cy="150" r="15" fill="#3A2010" stroke="#1A0A00" stroke-width="2.5"/>
    <circle cx="123" cy="150" r="9"  fill="#6A4020"/>
    <circle cx="123" cy="150" r="4"  fill="#2A1008"/>
    <line x1="123" y1="136" x2="123" y2="164" stroke="#8A5828" stroke-width="2"/>
    <line x1="109" y1="150" x2="137" y2="150" stroke="#8A5828" stroke-width="2"/>

    <!-- ── PUSH HANDLE (right side) ── -->
    <path d="M146 92 Q162 92 162 105 L162 124 Q162 136 146 136"
          fill="none" stroke="#5E3A1A" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>
