<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <!-- Clip bamboo grain lines to each basket band -->
    <clipPath id="b3"><rect x="44" y="140" width="104" height="22"/></clipPath>
    <clipPath id="b2"><rect x="44" y="116" width="104" height="24"/></clipPath>
    <clipPath id="b1"><rect x="44" y="94"  width="104" height="22"/></clipPath>
  </defs>

  <g filter="url(#ds)">

    <!-- ══════════════════════════════════
         BASKET 3 — BOTTOM
    ══════════════════════════════════ -->
    <!-- Side walls -->
    <rect x="44" y="140" width="104" height="22" fill="#A87030"/>
    <g clip-path="url(#b3)">
      <line x1="58"  y1="140" x2="58"  y2="162" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="72"  y1="140" x2="72"  y2="162" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="86"  y1="140" x2="86"  y2="162" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="140" x2="100" y2="162" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="114" y1="140" x2="114" y2="162" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="128" y1="140" x2="128" y2="162" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- Bottom edge ellipse (shadow) -->
    <ellipse cx="96" cy="162" rx="52" ry="10" fill="#8A5818" stroke="#6A4010" stroke-width="2"/>
    <!-- Side outline -->
    <path d="M44 140 L44 162 M148 140 L148 162" stroke="#7A5020" stroke-width="2"/>
    <!-- Top rim of basket 3 -->
    <ellipse cx="96" cy="140" rx="52" ry="10" fill="#C89050" stroke="#7A5020" stroke-width="2.5"/>

    <!-- ══════════════════════════════════
         BASKET 2 — MIDDLE
    ══════════════════════════════════ -->
    <rect x="44" y="116" width="104" height="24" fill="#B07832"/>
    <g clip-path="url(#b2)">
      <line x1="58"  y1="116" x2="58"  y2="140" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="72"  y1="116" x2="72"  y2="140" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="86"  y1="116" x2="86"  y2="140" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="116" x2="100" y2="140" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="114" y1="116" x2="114" y2="140" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="128" y1="116" x2="128" y2="140" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
    </g>
    <path d="M44 116 L44 140 M148 116 L148 140" stroke="#7A5020" stroke-width="2"/>
    <!-- Top rim of basket 2 -->
    <ellipse cx="96" cy="116" rx="52" ry="10" fill="#C89050" stroke="#7A5020" stroke-width="2.5"/>

    <!-- ══════════════════════════════════
         BASKET 1 — TOP (open, dumplings visible)
    ══════════════════════════════════ -->
    <rect x="44" y="94" width="104" height="22" fill="#B07832"/>
    <g clip-path="url(#b1)">
      <line x1="58"  y1="94" x2="58"  y2="116" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="72"  y1="94" x2="72"  y2="116" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="86"  y1="94" x2="86"  y2="116" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="100" y1="94" x2="100" y2="116" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="114" y1="94" x2="114" y2="116" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
      <line x1="128" y1="94" x2="128" y2="116" stroke="#7A5018" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- Dark interior of open top basket -->
    <ellipse cx="96" cy="94" rx="48" ry="8.5" fill="#5A3810"/>
    <!-- Three dumplings inside -->
    <ellipse cx="74"  cy="104" rx="14" ry="9" fill="#F5EDD8" stroke="#D4C0A0" stroke-width="1.5"/>
    <path d="M61 104 Q74 96 87 104" fill="none" stroke="#C4B090" stroke-width="1.5"/>
    <ellipse cx="96"  cy="101" rx="14" ry="9" fill="#F5EDD8" stroke="#D4C0A0" stroke-width="1.5"/>
    <path d="M83 101 Q96 93 109 101" fill="none" stroke="#C4B090" stroke-width="1.5"/>
    <ellipse cx="118" cy="104" rx="14" ry="9" fill="#F5EDD8" stroke="#D4C0A0" stroke-width="1.5"/>
    <path d="M105 104 Q118 96 131 104" fill="none" stroke="#C4B090" stroke-width="1.5"/>
    <!-- Top rim outline of basket 1 -->
    <ellipse cx="96" cy="94" rx="52" ry="10" fill="none" stroke="#7A5020" stroke-width="2.5"/>
    <path d="M44 94 L44 116 M148 94 L148 116" stroke="#7A5020" stroke-width="2"/>

    <!-- ══════════════════════════════════
         LID (slightly lifted / tilted)
    ══════════════════════════════════ -->
    <!-- Lid base rim -->
    <ellipse cx="96" cy="90" rx="54" ry="11" fill="#D4A060" stroke="#7A5020" stroke-width="3"/>
    <!-- Dome tier 1 -->
    <path d="M60 88 Q64 78 96 76 Q128 78 132 88 Z" fill="#C89050" stroke="#7A5020" stroke-width="2.5"/>
    <ellipse cx="96" cy="77" rx="36" ry="8" fill="#C89050" stroke="#7A5020" stroke-width="2"/>
    <!-- Dome tier 2 -->
    <path d="M72 76 Q75 67 96 65 Q117 67 120 76 Z" fill="#D4A060" stroke="#7A5020" stroke-width="2"/>
    <ellipse cx="96" cy="65" rx="24" ry="6" fill="#D4A060" stroke="#7A5020" stroke-width="1.5"/>
    <!-- Knob -->
    <ellipse cx="96" cy="60" rx="13" ry="6" fill="#E8B870" stroke="#7A5020" stroke-width="2"/>
    <ellipse cx="96" cy="56" rx="9"  ry="5" fill="#F0C880" stroke="#7A5020" stroke-width="1.5"/>

    <!-- ── STEAM WISPS ── -->
    <path d="M80 46 Q76 36 80 26 Q84 16 80 8"  fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M96 42 Q92 32 96 22 Q100 12 96 4"  fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M112 46 Q108 36 112 26 Q116 16 112 8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  </g>
</svg>
