<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <!-- Clip noodle contents to bowl interior -->
    <clipPath id="bowl">
      <path d="M32 104 Q32 162 96 164 Q160 162 160 104 Q144 96 96 94 Q48 96 32 104 Z"/>
    </clipPath>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0946A"/>
      <stop offset="100%" stop-color="#B04820"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── BOWL BODY ── -->
    <path d="M28 100 Q28 162 96 164 Q164 162 164 100 Q148 88 96 86 Q44 88 28 100 Z"
          fill="url(#bowlGrad)"/>

    <!-- Bowl interior — broth color -->
    <path d="M32 104 Q32 162 96 164 Q160 162 160 104 Q144 96 96 94 Q48 96 32 104 Z"
          fill="#C84818" clip-path="url(#bowl)"/>

    <!-- ── NOODLE CONTENTS (clipped) ── -->
    <g clip-path="url(#bowl)">
      <!-- Noodle wave 1 -->
      <path d="M44 118 Q58 106 72 120 Q86 134 100 118 Q114 102 128 118 Q138 128 150 120"
            fill="none" stroke="#F5EDD8" stroke-width="4" stroke-linecap="round"/>
      <!-- Noodle wave 2 -->
      <path d="M40 132 Q54 120 68 134 Q82 148 96 132 Q110 116 124 132 Q136 144 152 134"
            fill="none" stroke="#EFE0C4" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Noodle wave 3 (deeper) -->
      <path d="M46 146 Q62 136 76 148 Q90 160 104 146 Q118 132 132 146 Q140 154 150 148"
            fill="none" stroke="#E8D4B8" stroke-width="3" stroke-linecap="round"/>
      <!-- Soft-boiled egg -->
      <circle cx="96" cy="116" r="13" fill="#F5EDD8" stroke="#D8C8A0" stroke-width="1.5"/>
      <circle cx="96" cy="116" r="8"  fill="#F0C040"/>
      <circle cx="96" cy="116" r="8"  fill="none" stroke="#D4A020" stroke-width="1"/>
      <!-- Nori strip -->
      <rect x="74" y="108" width="9" height="16" rx="2" fill="#2A4020" opacity="0.85"/>
      <!-- Naruto/fish cake (pink swirl hint) -->
      <circle cx="115" cy="122" r="7" fill="#F5C0C0" stroke="#D89090" stroke-width="1.5"/>
      <path d="M112 122 Q115 118 118 122" fill="none" stroke="#D46060" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- ── BOWL RIM (top ellipse — drawn over contents) ── -->
    <ellipse cx="96" cy="98" rx="68" ry="16" fill="#F0A868"/>
    <ellipse cx="96" cy="98" rx="68" ry="16" fill="none" stroke="#7A3012" stroke-width="2.5"/>
    <!-- Bowl body outline -->
    <path d="M28 100 Q28 162 96 164 Q164 162 164 100"
          fill="none" stroke="#7A3012" stroke-width="3"/>

    <!-- ── CHOPSTICKS (resting across rim) ── -->
    <line x1="46"  y1="74"  x2="86"  y2="107" stroke="#8B5E3C" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="146" y1="74"  x2="106" y2="107" stroke="#8B5E3C" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Chopstick tips (tapered, darker) -->
    <line x1="84"  y1="105" x2="86"  y2="107" stroke="#5E3A1A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="108" y1="105" x2="106" y2="107" stroke="#5E3A1A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- ── STEAM WISPS ── -->
    <path d="M76 78 Q72 68 76 58 Q80 48 76 38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M96 74 Q92 64 96 54 Q100 44 96 34" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M116 78 Q112 68 116 58 Q120 48 116 38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

  </g>
</svg>
