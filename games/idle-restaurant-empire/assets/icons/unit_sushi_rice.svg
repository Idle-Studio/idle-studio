<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFAF4"/>
      <stop offset="60%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E4DDD0"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#D8D4CC"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── COOKER BODY ── -->
    <rect x="46" y="90" width="100" height="86" rx="10" ry="10" fill="url(#bodyGrad)" stroke="#0D47A1" stroke-width="3"/>

    <!-- Body highlight strip (left edge) -->
    <rect x="47" y="94" width="8" height="74" rx="4" fill="#FFFFFF" opacity="0.35"/>

    <!-- ── FRONT PANEL (blue accent) ── -->
    <rect x="56" y="108" width="48" height="52" rx="5" fill="url(#panelGrad)" stroke="#082060" stroke-width="1.5"/>

    <!-- LCD display -->
    <rect x="61" y="114" width="38" height="18" rx="3" fill="#0A1A3A" stroke="#42A5F5" stroke-width="1"/>
    <!-- LCD digits suggestion -->
    <rect x="66" y="118" width="6" height="10" rx="1" fill="#42A5F5" opacity="0.8"/>
    <rect x="75" y="118" width="6" height="10" rx="1" fill="#42A5F5" opacity="0.8"/>
    <rect x="84" y="118" width="2" height="10" rx="1" fill="#42A5F5" opacity="0.5"/>
    <rect x="88" y="118" width="6" height="10" rx="1" fill="#42A5F5" opacity="0.8"/>

    <!-- Button dots on panel -->
    <circle cx="65" cy="140" r="4" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
    <circle cx="80" cy="140" r="4" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
    <circle cx="95" cy="140" r="4" fill="#1565C0" stroke="#42A5F5" stroke-width="1.5"/>
    <!-- Button labels (dashes) -->
    <line x1="62" y1="140" x2="68" y2="140" stroke="#B3E5FC" stroke-width="1.5"/>
    <line x1="77" y1="140" x2="83" y2="140" stroke="#B3E5FC" stroke-width="1.5"/>
    <rect x="92" y="137" width="6" height="2" rx="1" fill="#B3E5FC"/>
    <rect x="92" y="141" width="6" height="2" rx="1" fill="#B3E5FC"/>

    <!-- Side vent lines on right side of body -->
    <line x1="114" y1="110" x2="138" y2="110" stroke="#C8C0B4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="114" y1="118" x2="138" y2="118" stroke="#C8C0B4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="114" y1="126" x2="138" y2="126" stroke="#C8C0B4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="114" y1="134" x2="138" y2="134" stroke="#C8C0B4" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ── LID ── -->
    <rect x="50" y="70" width="92" height="26" rx="8" ry="8" fill="url(#lidGrad)" stroke="#0D47A1" stroke-width="3"/>
    <!-- Lid highlight -->
    <rect x="54" y="73" width="30" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <!-- Lid seam line -->
    <line x1="52" y1="90" x2="140" y2="90" stroke="#BEB8B0" stroke-width="1.5"/>

    <!-- Steam vent oval on lid -->
    <ellipse cx="96" cy="72" rx="10" ry="5" fill="#D8D4CC" stroke="#0D47A1" stroke-width="1.5"/>
    <ellipse cx="96" cy="72" rx="6" ry="3" fill="#888880"/>

    <!-- ── LID HANDLE ── -->
    <rect x="82" y="60" width="28" height="14" rx="7" fill="#E8E4DC" stroke="#0D47A1" stroke-width="2"/>
    <rect x="85" y="63" width="10" height="5" rx="2.5" fill="#FFFFFF" opacity="0.5"/>

    <!-- ── STEAM WISPS ── -->
    <path d="M84 58 Q80 46 84 34 Q88 22 84 12"
          fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M96 56 Q92 44 96 32 Q100 20 96 10"
          fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108 58 Q104 46 108 34 Q112 22 108 12"
          fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ── BASE PLATFORM ── -->
    <rect x="42" y="172" width="108" height="8" rx="4" fill="#D8D0C4" stroke="#0D47A1" stroke-width="1.5"/>

  </g>
</svg>
