<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="leg1Grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#A03828"/>
      <stop offset="60%" stop-color="#8B2A1A"/>
      <stop offset="100%" stop-color="#5A1808"/>
    </linearGradient>
    <linearGradient id="leg2Grad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#962E20"/>
      <stop offset="60%" stop-color="#7A2014"/>
      <stop offset="100%" stop-color="#4E1406"/>
    </linearGradient>
    <linearGradient id="leg3Grad" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#A83C2C"/>
      <stop offset="60%" stop-color="#8B2A1A"/>
      <stop offset="100%" stop-color="#5A1808"/>
    </linearGradient>
    <radialGradient id="lightGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="herbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <g filter="url(#ds)">

    <!-- ── CURING ROOM BACKGROUND ── -->
    <rect x="22" y="22" width="148" height="150" rx="6" fill="#2A1008"/>
    <!-- Subtle wall texture lines -->
    <line x1="22" y1="56" x2="170" y2="56" stroke="#3A1810" stroke-width="1" opacity="0.5"/>
    <line x1="22" y1="90" x2="170" y2="90" stroke="#3A1810" stroke-width="1" opacity="0.5"/>
    <line x1="22" y1="124" x2="170" y2="124" stroke="#3A1810" stroke-width="1" opacity="0.4"/>
    <line x1="22" y1="158" x2="170" y2="158" stroke="#3A1810" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="22" x2="60" y2="172" stroke="#3A1810" stroke-width="1" opacity="0.3"/>
    <line x1="96" y1="22" x2="96" y2="172" stroke="#3A1810" stroke-width="1" opacity="0.3"/>
    <line x1="132" y1="22" x2="132" y2="172" stroke="#3A1810" stroke-width="1" opacity="0.3"/>

    <!-- ── CEILING BEAM ── -->
    <rect x="22" y="22" width="148" height="20" rx="3" fill="#3C1C0A"/>
    <line x1="22" y1="34" x2="170" y2="34" stroke="#4E2810" stroke-width="1.5" opacity="0.6"/>

    <!-- ── CEILING HOOKS (S-shapes) ── -->
    <!-- Hook 1 -->
    <path d="M52 34 Q52 30 48 28 Q44 26 44 22" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M52 34 Q56 36 56 40 Q56 44 52 46" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hook 2 -->
    <path d="M88 34 Q88 30 84 28 Q80 26 80 22" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M88 34 Q92 36 92 40 Q92 44 88 46" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hook 3 -->
    <path d="M124 34 Q124 30 120 28 Q116 26 116 22" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M124 34 Q128 36 128 40 Q128 44 124 46" fill="none" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hook 4 (smaller, background) -->
    <path d="M154 34 Q154 31 151 29" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round"/>
    <path d="M154 34 Q157 36 157 39 Q157 42 154 44" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round"/>
    <!-- Hook 5 (far left, partial) -->
    <path d="M32 34 Q35 36 35 40 Q35 44 32 46" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round"/>

    <!-- ── PROSCIUTTO LEG 1 (left) ── -->
    <!-- Leg body -->
    <path d="M38 46 Q32 54 32 72 Q30 100 34 130 Q36 148 40 158 Q44 166 48 164 Q52 162 54 154 Q56 144 54 130 Q56 104 58 76 Q62 56 56 46 Z"
          fill="url(#leg1Grad)" stroke="#3A1008" stroke-width="2"/>
    <!-- Fat rim (creamy edge) -->
    <path d="M38 46 Q34 52 32 64 Q30 80 32 100 Q33 116 36 130 Q38 144 40 158"
          fill="none" stroke="#F0D8B8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- Surface highlight (top light) -->
    <path d="M40 46 Q36 54 35 68 Q33 82 35 96"
          fill="none" stroke="#C04030" stroke-width="4" opacity="0.4"/>
    <!-- Salt crystals (tiny white dots) -->
    <circle cx="44" cy="80" r="1.2" fill="#F0F0E8" opacity="0.7"/>
    <circle cx="38" cy="95" r="1" fill="#F0F0E8" opacity="0.7"/>
    <circle cx="50" cy="110" r="1.2" fill="#F0F0E8" opacity="0.6"/>
    <circle cx="42" cy="125" r="1" fill="#F0F0E8" opacity="0.6"/>
    <circle cx="46" cy="68" r="1" fill="#F0F0E8" opacity="0.5"/>
    <circle cx="52" cy="90" r="1" fill="#F0F0E8" opacity="0.6"/>
    <!-- Hock tie at top -->
    <path d="M38 48 Q47 44 56 48" fill="none" stroke="#4A2810" stroke-width="3" stroke-linecap="round"/>

    <!-- ── PROSCIUTTO LEG 2 (center) ── -->
    <path d="M74 46 Q68 56 67 76 Q65 106 68 134 Q70 152 74 162 Q78 170 82 168 Q86 166 88 158 Q90 146 88 134 Q90 106 92 78 Q96 58 90 46 Z"
          fill="url(#leg2Grad)" stroke="#3A1008" stroke-width="2"/>
    <!-- Fat rim -->
    <path d="M74 46 Q70 54 68 68 Q66 86 68 108 Q69 126 72 142 Q74 154 76 162"
          fill="none" stroke="#F0D8B8" stroke-width="5.5" stroke-linecap="round" opacity="0.72"/>
    <!-- Highlight -->
    <path d="M76 48 Q72 58 70 72 Q68 88 70 104"
          fill="none" stroke="#B83828" stroke-width="4" opacity="0.4"/>
    <!-- Salt crystals -->
    <circle cx="80" cy="72" r="1.2" fill="#F0F0E8" opacity="0.7"/>
    <circle cx="74" cy="88" r="1.2" fill="#F0F0E8" opacity="0.7"/>
    <circle cx="86" cy="102" r="1" fill="#F0F0E8" opacity="0.65"/>
    <circle cx="78" cy="118" r="1.2" fill="#F0F0E8" opacity="0.65"/>
    <circle cx="82" cy="136" r="1" fill="#F0F0E8" opacity="0.55"/>
    <circle cx="72" cy="154" r="1" fill="#F0F0E8" opacity="0.5"/>
    <!-- Hock tie -->
    <path d="M74 48 Q82 44 90 48" fill="none" stroke="#4A2810" stroke-width="3" stroke-linecap="round"/>

    <!-- ── PROSCIUTTO LEG 3 (right) ── -->
    <path d="M110 46 Q104 56 103 74 Q101 102 104 128 Q106 148 110 160 Q114 168 118 166 Q122 164 124 156 Q126 144 124 128 Q126 104 128 76 Q132 56 128 46 Z"
          fill="url(#leg3Grad)" stroke="#3A1008" stroke-width="2"/>
    <!-- Fat rim -->
    <path d="M110 46 Q106 54 104 66 Q102 84 104 106 Q106 122 108 138 Q110 152 112 160"
          fill="none" stroke="#F0D8B8" stroke-width="5" stroke-linecap="round" opacity="0.68"/>
    <!-- Highlight -->
    <path d="M112 48 Q108 58 106 72 Q104 88 106 102"
          fill="none" stroke="#C04030" stroke-width="4" opacity="0.4"/>
    <!-- Salt crystals -->
    <circle cx="116" cy="76" r="1.2" fill="#F0F0E8" opacity="0.7"/>
    <circle cx="110" cy="92" r="1" fill="#F0F0E8" opacity="0.7"/>
    <circle cx="122" cy="108" r="1.2" fill="#F0F0E8" opacity="0.65"/>
    <circle cx="116" cy="124" r="1" fill="#F0F0E8" opacity="0.6"/>
    <circle cx="112" cy="142" r="1" fill="#F0F0E8" opacity="0.55"/>
    <!-- Hock tie -->
    <path d="M110 48 Q119 44 128 48" fill="none" stroke="#4A2810" stroke-width="3" stroke-linecap="round"/>

    <!-- ── 4TH LEG (background, partially visible, right edge) ── -->
    <path d="M148 46 Q144 58 143 78 Q141 106 144 130 Q146 148 150 160 Q153 165 156 163 Q158 148 158 130 Q160 104 162 76 Q164 56 162 46 Z"
          fill="#6A1C10" stroke="#3A1008" stroke-width="1.5" opacity="0.7"/>
    <!-- Fat rim -->
    <path d="M148 46 Q145 56 143 72 Q141 92 143 114"
          fill="none" stroke="#D0C0A0" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <!-- Hock tie -->
    <path d="M148 48 Q155 44 162 48" fill="none" stroke="#3A1808" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- ── OVERHEAD LIGHT EFFECT (subtle) ── -->
    <rect x="22" y="22" width="148" height="150" rx="6" fill="url(#lightGrad)"/>

    <!-- ── BASIL GREEN HERB SPRIGS (left side accent) ── -->
    <!-- Stem -->
    <path d="M26 100 Q28 88 30 76 Q32 68 28 60" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="24" cy="92" rx="6" ry="3" fill="url(#herbGrad)" stroke="#1B5E20" stroke-width="1" transform="rotate(-40 24 92)"/>
    <ellipse cx="30" cy="82" rx="6" ry="3" fill="url(#herbGrad)" stroke="#1B5E20" stroke-width="1" transform="rotate(30 30 82)"/>
    <ellipse cx="26" cy="72" rx="5.5" ry="3" fill="#4CAF50" stroke="#1B5E20" stroke-width="1" transform="rotate(-20 26 72)"/>
    <ellipse cx="30" cy="63" rx="5" ry="2.5" fill="url(#herbGrad)" stroke="#1B5E20" stroke-width="1" transform="rotate(15 30 63)"/>
    <!-- Second sprig -->
    <path d="M24 140 Q22 130 24 122 Q26 116 22 110" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="22" cy="134" rx="5" ry="2.5" fill="#4CAF50" stroke="#1B5E20" stroke-width="1" transform="rotate(-35 22 134)"/>
    <ellipse cx="24" cy="124" rx="5" ry="2.5" fill="url(#herbGrad)" stroke="#1B5E20" stroke-width="1" transform="rotate(25 24 124)"/>
    <ellipse cx="21" cy="114" rx="4.5" ry="2.5" fill="#4CAF50" stroke="#1B5E20" stroke-width="1" transform="rotate(-15 21 114)"/>

  </g>
</svg>
