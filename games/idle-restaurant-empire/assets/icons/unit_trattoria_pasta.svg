<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3A1500" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="machineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4943C"/>
      <stop offset="100%" stop-color="#8B5820"/>
    </linearGradient>
    <linearGradient id="machineSideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C07828"/>
      <stop offset="100%" stop-color="#7A4810"/>
    </linearGradient>
    <linearGradient id="diePlateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A6830"/>
      <stop offset="100%" stop-color="#6A3C10"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A06A40"/>
      <stop offset="100%" stop-color="#6B4020"/>
    </linearGradient>
    <clipPath id="machineClip">
      <rect x="42" y="44" width="90" height="72" rx="6"/>
    </clipPath>
  </defs>

  <g filter="url(#ds)">

    <!-- ── WOODEN BOARD BASE ── -->
    <rect x="34" y="114" width="110" height="14" rx="4" fill="url(#boardGrad)" stroke="#5A3010" stroke-width="2"/>
    <!-- Board wood grain lines -->
    <line x1="44" y1="117" x2="44" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>
    <line x1="58" y1="117" x2="58" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>
    <line x1="72" y1="117" x2="72" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>
    <line x1="86" y1="117" x2="86" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="117" x2="100" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>
    <line x1="114" y1="117" x2="114" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>
    <line x1="128" y1="117" x2="128" y2="125" stroke="#7A4820" stroke-width="1" opacity="0.5"/>

    <!-- ── MACHINE BODY (main block) ── -->
    <rect x="42" y="44" width="90" height="72" rx="6" fill="url(#machineGrad)" stroke="#6A3C10" stroke-width="3"/>

    <!-- Machine top face (3D effect) -->
    <rect x="44" y="44" width="86" height="10" rx="4" fill="#D4943C" opacity="0.6"/>

    <!-- Machine front panel recess -->
    <rect x="52" y="56" width="70" height="48" rx="3" fill="#A06030" opacity="0.4"/>

    <!-- ── CORNER BOLTS ── -->
    <circle cx="52" cy="54" r="4.5" fill="#D4943C" stroke="#6A3C10" stroke-width="1.5"/>
    <circle cx="52" cy="54" r="2" fill="#8B5820"/>
    <circle cx="122" cy="54" r="4.5" fill="#D4943C" stroke="#6A3C10" stroke-width="1.5"/>
    <circle cx="122" cy="54" r="2" fill="#8B5820"/>
    <circle cx="52" cy="108" r="4.5" fill="#D4943C" stroke="#6A3C10" stroke-width="1.5"/>
    <circle cx="52" cy="108" r="2" fill="#8B5820"/>
    <circle cx="122" cy="108" r="4.5" fill="#D4943C" stroke="#6A3C10" stroke-width="1.5"/>
    <circle cx="122" cy="108" r="2" fill="#8B5820"/>

    <!-- ── DIE PLATE (circular front face) ── -->
    <circle cx="87" cy="81" r="26" fill="url(#diePlateGrad)" stroke="#4A2808" stroke-width="3"/>
    <!-- Die plate inner ring -->
    <circle cx="87" cy="81" r="22" fill="none" stroke="#5A3810" stroke-width="1.5" opacity="0.7"/>
    <!-- Die holes pattern — 3x3 grid of small circles -->
    <circle cx="78" cy="72" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="87" cy="72" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="96" cy="72" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="78" cy="81" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="87" cy="81" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="96" cy="81" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="78" cy="90" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="87" cy="90" r="2.5" fill="#3A2008" opacity="0.8"/>
    <circle cx="96" cy="90" r="2.5" fill="#3A2008" opacity="0.8"/>
    <!-- Extra holes in die plate -->
    <circle cx="69" cy="76" r="2" fill="#3A2008" opacity="0.6"/>
    <circle cx="69" cy="86" r="2" fill="#3A2008" opacity="0.6"/>
    <circle cx="105" cy="76" r="2" fill="#3A2008" opacity="0.6"/>
    <circle cx="105" cy="86" r="2" fill="#3A2008" opacity="0.6"/>

    <!-- ── CRANK HANDLE (right side) ── -->
    <!-- Crank arm -->
    <line x1="132" y1="81" x2="154" y2="81" stroke="#B87030" stroke-width="5" stroke-linecap="round"/>
    <!-- Crank elbow -->
    <line x1="154" y1="81" x2="154" y2="66" stroke="#B87030" stroke-width="5" stroke-linecap="round"/>
    <!-- Handle grip -->
    <circle cx="154" cy="62" r="7" fill="#D4943C" stroke="#6A3C10" stroke-width="2"/>
    <circle cx="154" cy="62" r="3.5" fill="#8B5820"/>
    <!-- Crank hub -->
    <circle cx="132" cy="81" r="5" fill="#8B5820" stroke="#4A2808" stroke-width="1.5"/>

    <!-- ── SPAGHETTI STRANDS hanging from die ── -->
    <!-- Strand 1 -->
    <path d="M73 107 Q71 115 73 123 Q75 131 73 139 Q71 147 73 158" fill="none" stroke="#F5EDD8" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <!-- Strand 2 -->
    <path d="M77 107 Q79 116 77 125 Q75 134 77 142 Q79 150 77 158" fill="none" stroke="#EFE4CC" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <!-- Strand 3 -->
    <path d="M81 107 Q79 114 81 122 Q83 130 81 138 Q79 146 81 155" fill="none" stroke="#F5EDD8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Strand 4 -->
    <path d="M85 107 Q87 116 85 125 Q83 134 85 142 Q87 151 85 158" fill="none" stroke="#EDE0C4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Strand 5 -->
    <path d="M89 107 Q87 115 89 123 Q91 131 89 140 Q87 149 89 157" fill="none" stroke="#F5EDD8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Strand 6 -->
    <path d="M93 107 Q95 116 93 124 Q91 132 93 141 Q95 150 93 158" fill="none" stroke="#EFE4CC" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Strand 7 -->
    <path d="M97 107 Q95 114 97 122 Q99 130 97 139 Q95 148 97 156" fill="none" stroke="#F5EDD8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- Strand 8 -->
    <path d="M101 107 Q103 116 101 125 Q99 134 101 142 Q103 150 101 157" fill="none" stroke="#EDE0C4" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <!-- Strand 9 (faint outer) -->
    <path d="M68 108 Q66 117 68 126 Q70 135 68 144 Q66 153 68 160" fill="none" stroke="#F0DFC0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- Strand 10 (faint outer) -->
    <path d="M106 108 Q108 117 106 126 Q104 135 106 144 Q108 152 106 160" fill="none" stroke="#F0DFC0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Small gathering bundle at die opening -->
    <ellipse cx="87" cy="108" rx="18" ry="3" fill="#E8D8B0" opacity="0.4"/>

    <!-- ── MACHINE LABEL PLATE ── -->
    <rect x="54" y="60" width="20" height="10" rx="2" fill="#C07028" opacity="0.6" stroke="#8B5820" stroke-width="1"/>

  </g>
</svg>
